<div class="dashboard-card actions-card">
  <div class="card-header">
    <span class="material-symbols-outlined">flash_on</span>
    <h3>Quick Actions</h3>
  </div>
  <div class="card-content">
    <div class="actions-grid">
      <button class="action-card" onclick="findAllTags()">
        <span class="material-symbols-outlined">search</span>
        <span>Find All Tags</span>
      </button>
      <button class="action-card" id="scan-wi-btn">
        <span class="material-symbols-outlined">wifi_tethering</span>
        <span>Scan Wi</span>
      </button>
      <button class="action-card" onclick="blinkAllTags()">
        <span class="material-symbols-outlined">visibility</span>
        <span>Blink All</span>
      </button>
      <button class="action-card" id="led-off-btn">
        <span class="material-symbols-outlined">lightbulb</span>
        <span>LED Off</span>
      </button>
      <button class="action-card" onclick="refreshAllTags()">
        <span class="material-symbols-outlined">refresh</span>
        <span>Refresh All</span>
      </button>
      <button class="action-card" onclick="openAdvancedControl()">
        <span class="material-symbols-outlined">tune</span>
        <span>Advanced Control</span>
      </button>
    </div>
  </div>
</div>
