<!DOCTYPE HTML>
<html>

<head>
	<meta http-equiv="content-type" content="text/html; charset=utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />

	<title>OpenEPL ESP32 - System Logs</title>
	<script src="main.js?2.74" defer></script>
	<link rel="stylesheet" href="main.css?2.74" type="text/css" />
	<link rel="stylesheet" href="advanced-styles.css" type="text/css" />
	<link rel="stylesheet"
		  href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
	<!-- Enhanced Compact Header with Menu and Status -->
	<header class="advanced-header">
		<div class="compact-header-content">
			<div class="header-left">
				<div class="logo-section">
					<div class="logo-icon">📋</div>
					<div class="logo-text">
						<h1>OpenEPL ESP32 Logs</h1>
					</div>
				</div>
			</div>
			
			<div class="header-status">
				<div class="status-item">
					<div class="status-dot" id="systemDot"></div>
					<span id="systemStatus">Ready</span>
				</div>
				<div class="status-item">
					<span class="material-symbols-outlined" style="font-size: 12px;">devices</span>
					<span id="tagCount">Tags</span>
				</div>
				<div class="status-item">
					<span class="material-symbols-outlined" style="font-size: 12px;">wifi</span>
					<span id="wifiStatus">WiFi</span>
				</div>
				<div class="status-item">
					<span class="material-symbols-outlined" style="font-size: 12px;">schedule</span>
					<span id="uptimeDisplay">--:--</span>
				</div>
			</div>
			
						<!-- Universal Menu Container -->
			<div id="menu-container" class="menu-container"></div>
		</div>
	</header>

	<div class="container">
		<div class="window">
			<!-- Logs Tab Content -->
			<div id="logtab" class="tabcontent active">
				<div class="tabheader">
					<div><img id="clearlog" src="data:image/gif;base64,R0lGODlhEAAQAPMAANXV1e3t7d/f39HR0dvb2/Hx8dTU1OLi4urq6mZmZpmZmf///wAAAAAAAAAAAAAAACH5BAEAAAwALAAAAAAQABAAAARBkMlJq71Yrp3ZXkr4WWCYnOZSgQVyEMYwJCq1nHhe20qgCAoA7QLyAYU7njE4JPV+zOSkCEUSFbmTVPPpbjvgTAQAOw==
				"></div>
					<div><input type="checkbox" id="showdebug" value="1"><label for="showdebug">Show all websocket traffic</label></div>
				</div>
				<ul id="messages" class="messages">
				</ul>
			</div>
		</div>
	</div>

	<!-- Footer Status Line -->
	<div class="footer-status">
		<div class="footer-left">
			<div class="footer-item">
				<span class="material-symbols-outlined" style="font-size: 10px;">developer_board</span>
				<span id="footerSystemInfo">System Ready</span>
			</div>
			<div class="footer-item">
				<span class="material-symbols-outlined" style="font-size: 10px;">memory</span>
				<span id="footerMemoryInfo">Memory OK</span>
			</div>
			<div class="footer-item">
				<span class="material-symbols-outlined" style="font-size: 10px;">wifi</span>
				<span id="footerWifiInfo">WiFi Ready</span>
			</div>
			<div class="footer-item">
				<span class="material-symbols-outlined" style="font-size: 10px;">devices</span>
				<span id="footerTagInfo">Tags Ready</span>
			</div>
			<div class="footer-item">
				<span class="material-symbols-outlined" style="font-size: 10px;">speed</span>
				<span id="footerPerformance">Performance OK</span>
			</div>
		</div>
		<div class="footer-right">
			<span id="footerTimestamp">Ready</span>
		</div>
	</div>

</body>

</html>
