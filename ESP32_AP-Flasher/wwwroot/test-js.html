<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Test Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f0f0f0;
        }
        .test-result {
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
        }
        .pass {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .fail {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .warn {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
        button {
            margin: 5px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #007bff;
            color: white;
        }
        button:hover {
            background: #0056b3;
        }
        #console-output {
            background: #000;
            color: #0f0;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>JavaScript Diagnostic Test</h1>
    
    <h2>Test Results</h2>
    <div id="test-results"></div>
    
    <h2>Interactive Tests</h2>
    <button onclick="testNavigationLinks()">Test Navigation Links</button>
    <button onclick="testApiCalls()">Test API Calls</button>
    <button onclick="testDOMElements()">Test DOM Elements</button>
    <button onclick="clearConsole()">Clear Console</button>
    
    <h2>Console Output</h2>
    <div id="console-output"></div>

    <script>
        // Override console.log to capture output
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;
        
        function addToConsole(message, type = 'log') {
            const output = document.getElementById('console-output');
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'error' ? '#f00' : type === 'warn' ? '#ff0' : '#0f0';
            output.innerHTML += `<div style="color: ${color}">[${timestamp}] ${message}</div>`;
            output.scrollTop = output.scrollHeight;
        }
        
        console.log = function(...args) {
            originalLog.apply(console, args);
            addToConsole(args.join(' '), 'log');
        };
        
        console.error = function(...args) {
            originalError.apply(console, args);
            addToConsole(args.join(' '), 'error');
        };
        
        console.warn = function(...args) {
            originalWarn.apply(console, args);
            addToConsole(args.join(' '), 'warn');
        };

        function addTestResult(test, status, message) {
            const results = document.getElementById('test-results');
            const div = document.createElement('div');
            div.className = `test-result ${status}`;
            div.innerHTML = `<strong>${test}:</strong> ${message}`;
            results.appendChild(div);
        }

        function clearConsole() {
            document.getElementById('console-output').innerHTML = '';
        }

        // Helper function (copied from fixed index.html)
        function getApiEndpoint(path) {
            const isLocal = window.location.port === '3000';
            return isLocal ? `http://192.168.4.1/${path}` : path;
        }

        // Test 1: Basic JavaScript functionality
        function testBasicJS() {
            try {
                const testArray = [1, 2, 3];
                const testObject = { test: 'value' };
                const testFunction = () => 'test';
                
                if (testArray.length === 3 && testObject.test === 'value' && testFunction() === 'test') {
                    addTestResult('Basic JavaScript', 'pass', 'Arrays, objects, and functions working correctly');
                    return true;
                } else {
                    addTestResult('Basic JavaScript', 'fail', 'Basic functionality test failed');
                    return false;
                }
            } catch (error) {
                addTestResult('Basic JavaScript', 'fail', `Error: ${error.message}`);
                return false;
            }
        }

        // Test 2: DOM manipulation
        function testDOMElements() {
            console.log('Testing DOM element access...');
            
            try {
                // Test basic DOM access
                const body = document.body;
                const testDiv = document.createElement('div');
                testDiv.id = 'test-element';
                testDiv.innerHTML = 'Test Element';
                body.appendChild(testDiv);
                
                const retrieved = document.getElementById('test-element');
                if (retrieved && retrieved.innerHTML === 'Test Element') {
                    addTestResult('DOM Manipulation', 'pass', 'createElement, appendChild, getElementById working');
                    body.removeChild(testDiv);
                } else {
                    addTestResult('DOM Manipulation', 'fail', 'DOM element creation/retrieval failed');
                }
                
                // Test querySelector
                const buttons = document.querySelectorAll('button');
                addTestResult('DOM Query', 'pass', `Found ${buttons.length} buttons using querySelectorAll`);
                
            } catch (error) {
                addTestResult('DOM Manipulation', 'fail', `Error: ${error.message}`);
            }
        }

        // Test 3: Navigation links
        function testNavigationLinks() {
            console.log('Testing navigation link access...');
            
            const testLinks = [
                'dashboard.html',
                'tags.html',
                'settings.html',
                'index.html'
            ];
            
            testLinks.forEach(link => {
                fetch(link, { method: 'HEAD' })
                    .then(response => {
                        if (response.ok) {
                            console.log(`✓ ${link} - Available`);
                            addTestResult(`Link ${link}`, 'pass', 'File exists and accessible');
                        } else {
                            console.log(`✗ ${link} - Status: ${response.status}`);
                            addTestResult(`Link ${link}`, 'fail', `HTTP ${response.status}`);
                        }
                    })
                    .catch(error => {
                        console.error(`✗ ${link} - Error: ${error.message}`);
                        addTestResult(`Link ${link}`, 'fail', `Error: ${error.message}`);
                    });
            });
        }

        // Test 4: API calls
        function testApiCalls() {
            console.log('Testing API endpoint access...');
            
            const testEndpoints = [
                'get_ap_config',
                'get_db?pos=0',
                'version.txt'
            ];
            
            testEndpoints.forEach(endpoint => {
                const url = getApiEndpoint(endpoint);
                console.log(`Testing endpoint: ${url}`);
                
                fetch(url, { method: 'HEAD' })
                    .then(response => {
                        if (response.ok) {
                            console.log(`✓ ${endpoint} - Available`);
                            addTestResult(`API ${endpoint}`, 'pass', 'Endpoint responding');
                        } else {
                            console.log(`✗ ${endpoint} - Status: ${response.status}`);
                            addTestResult(`API ${endpoint}`, 'warn', `HTTP ${response.status} (expected in development)`);
                        }
                    })
                    .catch(error => {
                        console.log(`✗ ${endpoint} - Error: ${error.message}`);
                        addTestResult(`API ${endpoint}`, 'warn', `${error.message} (expected in development)`);
                    });
            });
        }

        // Test 5: Event listeners
        function testEventListeners() {
            try {
                const testElement = document.createElement('button');
                testElement.id = 'test-button';
                let eventFired = false;
                
                testElement.addEventListener('click', () => {
                    eventFired = true;
                });
                
                // Simulate click
                testElement.click();
                
                if (eventFired) {
                    addTestResult('Event Listeners', 'pass', 'addEventListener and click events working');
                } else {
                    addTestResult('Event Listeners', 'fail', 'Event listener did not fire');
                }
            } catch (error) {
                addTestResult('Event Listeners', 'fail', `Error: ${error.message}`);
            }
        }

        // Test 6: Fetch API
        function testFetchAPI() {
            // Test with a known endpoint (should work)
            fetch('./', { method: 'HEAD' })
                .then(response => {
                    if (response.ok) {
                        addTestResult('Fetch API', 'pass', 'Fetch API working correctly');
                    } else {
                        addTestResult('Fetch API', 'warn', `Fetch returned ${response.status}`);
                    }
                })
                .catch(error => {
                    addTestResult('Fetch API', 'fail', `Fetch error: ${error.message}`);
                });
        }

        // Run all tests when page loads
        document.addEventListener('DOMContentLoaded', function() {
            console.log('JavaScript Diagnostic Test Starting...');
            
            // Run basic tests
            testBasicJS();
            testEventListeners();
            testFetchAPI();
            
            console.log('Basic tests completed. Use buttons to run interactive tests.');
        });
    </script>
</body>
</html>
