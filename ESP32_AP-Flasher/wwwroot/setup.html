<!DOCTYPE HTML>
<html>

<head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />

    <title>setup page - Open EPaper Link Access Point</title>
    <link rel="stylesheet" href="merged-styles.css" type="text/css" />
    <link rel="icon" type="image/vnd.icon" href="favicon.ico">
    <style>
        .window {
            margin-left: 10px;
        }
        p {
            margin-bottom: 10px;
        }
        .window input {
            width: 120px;
        }
        h1 {
            padding-top: 20px;
        }
        option, select {
            font-family: monospace, 'lucida console', 'Courier New', Courier;
        }
        .status-message {
            margin-left: 10px;
            padding: 5px;
            border-radius: 3px;
            font-weight: bold;
        }
        .status-success {
            color: #4CAF50;
            background-color: rgba(76, 175, 80, 0.1);
        }
        .status-error {
            color: #f44336;
            background-color: rgba(244, 67, 54, 0.1);
        }
        .status-info {
            color: #2196F3;
            background-color: rgba(33, 150, 243, 0.1);
        }
        #listssid:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .wifi-info {
            margin-top: 10px;
            padding: 10px;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 5px;
            border-left: 3px solid #4facfe;
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">Open EPaper Link Access Point</div>
    </header>

    <div class="container">
        <div class="window">
            <h1>WiFi config</h1>
            <p>WiFi mac address: <span id="mac">-</span></p>
            <div id="wifi_status" class="wifi-info" style="display: none;">
                <strong>WiFi Status:</strong> <span id="wifi_status_text">Checking...</span>
            </div>
            <pre>
SSID            <input type="text" id="ssid"> <button id="listssid">find SSID</button>
Password        <input type="password" id="pw">
            </pre>
            <div id="scan_status"></div>
            <p>Fill in fields below for static IP. Otherwise, leave empty.<br></p>
            <pre>
Static IP       <input type="text" id="ip">
Subnet mask     <input type="text" id="mask">
Gateway         <input type="text" id="gw">
DNS             <input type="text" id="dns">
            </pre>
            <button id="connect">Save WiFi settings and reboot</button><br>
            <div id="save_status"></div>

        </div>
    </div>
    <script src="constants.js"></script>
    <script src="main.js"></script>

</body>

</html>
