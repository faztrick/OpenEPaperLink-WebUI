<!DOCTYPE HTML>
<html data-page="logs">

<head>
	<meta http-equiv="content-type" content="text/html; charset=utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />

	<title>OpenEPL ESP32 - System Logs</title>
	<!-- Unified boot system -->
	<script src="core/page-manifest.js"></script>
	<script src="core/boot.js" defer></script>
	<!-- Socket.IO client retained (external to boot manifest) -->
	<script src="/socket.io/socket.io.js" defer></script>
	<link rel="stylesheet" href="merged-styles.css?2.74" type="text/css" />

	<link rel="stylesheet"
		  href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
	<style>
		/* Logs page specific styles */
		.tabheader {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 20px;
			padding: 15px;
			background: rgba(255, 255, 255, 0.1);
			border-radius: 8px;
			border: 1px solid rgba(255, 255, 255, 0.2);
		}

		.tabheader img {
			cursor: pointer;
			width: 16px;
			height: 16px;
			filter: invert(1);
			opacity: 0.8;
			transition: opacity 0.3s ease;
		}

		.tabheader img:hover {
			opacity: 1;
		}

		.messages {
			background: rgba(0, 0, 0, 0.8);
			border: 1px solid rgba(255, 255, 255, 0.2);
			border-radius: 8px;
			padding: 15px;
			font-family: 'Courier New', monospace;
			font-size: 12px;
			color: #00ff00;
			height: 500px;
			overflow-y: auto;
			white-space: pre-wrap;
			word-wrap: break-word;
			list-style: none;
			margin: 0;
		}

		.messages li {
			margin: 2px 0;
			line-height: 1.4;
			padding: 2px 0;
		}

		.messages li.error {
			color: #ff6b6b;
		}

		.messages li.warning {
			color: #ffd93d;
		}

		.messages li.info {
			color: #6bcf7f;
		}

		.messages li.debug {
			color: #74b9ff;
			opacity: 0.7;
		}

		input[type="checkbox"] {
			margin-right: 8px;
		}

		label {
			color: rgba(255, 255, 255, 0.9);
			font-size: 14px;
		}
	</style>
</head>

<body>
	<!-- Header replaced by shared-nav.js injection -->

	<div class="container">
		<div class="window">
			<!-- Logs Tab Content -->
			<div id="logtab" class="tabcontent active">
				<div class="tabheader">
					<div><img id="clearlog" src="data:image/gif;base64,R0lGODlhEAAQAPMAANXV1e3t7d/f39HR0dvb2/Hx8dTU1OLi4urq6mZmZpmZmf///wAAAAAAAAAAAAAAACH5BAEAAAwALAAAAAAQABAAAARBkMlJq71Yrp3ZXkr4WWCYnOZSgQVyEMYwJCq1nHhe20qgCAoA7QLyAYU7njE4JPV+zOSkCEUSFbmTVPPpbjvgTAQAOw==
				"></div>
					<div><input type="checkbox" id="showdebug" value="1"><label for="showdebug">Show all websocket traffic</label></div>
					<div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap">
						<input id="deviceHost" type="text" placeholder="Device IP (e.g. 192.168.4.1)" style="min-width:220px; padding:6px 8px; border-radius:6px; border:1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.06); color:#fff;">
						<input id="tailLines" type="number" min="10" max="2000" value="200" title="Lines" style="width:82px; padding:6px 8px; border-radius:6px; border:1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.06); color:#fff;">
						<button id="btnFollow" class="btn" style="padding:6px 10px">Follow</button>
						<button id="btnUnfollow" class="btn" style="padding:6px 10px">Stop</button>
						<button id="btnFetchOnce" class="btn" style="padding:6px 10px">Fetch once</button>
						<input id="tftText" type="text" placeholder="Send to TFT..." style="min-width:220px; padding:6px 8px; border-radius:6px; border:1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.06); color:#fff;">
						<button id="btnTftPrint" class="btn" style="padding:6px 10px">Send to TFT</button>
					</div>
				</div>
				<ul id="messages" class="messages">
				</ul>
			</div>
		</div>
	</div>

	<!-- Footer Status Line -->
	<div class="footer-status">
		<div class="footer-left">
			<div class="footer-item">
				<span class="material-symbols-outlined" style="font-size: 10px;">developer_board</span>
				<span id="footerSystemInfo">System Ready</span>
			</div>
			<div class="footer-item">
				<span class="material-symbols-outlined" style="font-size: 10px;">memory</span>
				<span id="footerMemoryInfo">Memory OK</span>
			</div>
			<div class="footer-item">
				<span class="material-symbols-outlined" style="font-size: 10px;">wifi</span>
				<span id="footerWifiInfo">WiFi Ready</span>
			</div>
			<div class="footer-item">
				<span class="material-symbols-outlined" style="font-size: 10px;">devices</span>
				<span id="footerTagInfo">Tags Ready</span>
			</div>
			<div class="footer-item">
				<span class="material-symbols-outlined" style="font-size: 10px;">speed</span>
				<span id="footerPerformance">Performance OK</span>
			</div>
		</div>
		<div class="footer-right">
			<span id="footerTimestamp">Ready</span>
		</div>
	</div>

	<script>
		// Application initialization with proper script loading wait
		document.addEventListener('DOMContentLoaded', function() {
			// Wait for essential classes to be loaded
			const waitForClasses = () => {
				const requiredClasses = ['tagDB', 'loadTags'];
				const allLoaded = requiredClasses.every(className => typeof window[className] !== 'undefined');

				if (allLoaded) {
					// Initialize logs functionality
					try {
						if (typeof loadTags === 'function') {
							loadTags(0);
						}

						// Initialize logs-specific functionality
						if (typeof window.initLogsPage === 'function') {
							window.initLogsPage();
						}
					} catch (error) {
						console.error('Failed to initialize logs page:', error);
					}
				} else {
					// Check again in 100ms
					setTimeout(waitForClasses, 100);
				}
			};

			waitForClasses();
		});

		// Update status functions
		function updateCompactHeaderStatus() {
			fetch('get_ap_config')
				.then(response => response.json())
				.then(data => {
					const systemDot = document.getElementById('systemDot');
					const systemStatus = document.getElementById('systemStatus');
					const tagCount = document.getElementById('tagCount');
					const wifiStatus = document.getElementById('wifiStatus');

					if (systemDot && systemStatus && data.apstate !== undefined) {
						if (data.apstate === 1) {
							systemDot.className = 'status-dot online';
							systemStatus.textContent = 'Online';
						} else if (data.apstate === 2) {
							systemDot.className = 'status-dot warning';
							systemStatus.textContent = 'Flashing';
						} else if (data.apstate === 5) {
							systemDot.className = 'status-dot offline';
							systemStatus.textContent = 'Failed';
						} else {
							systemDot.className = 'status-dot warning';
							systemStatus.textContent = 'Starting';
						}
					}

					if (tagCount) {
						const totalTags = Object.keys(tagDB || {}).length;
						tagCount.textContent = `${totalTags} Tags`;
					}

					if (wifiStatus) {
						wifiStatus.textContent = data.wifiConnected ? 'Connected' : 'Disconnected';
					}
				})
				.catch(error => {
					console.error('Status update error:', error);
				});
		}

		function updateFooterStatus() {
			const timestamp = new Date().toLocaleTimeString();
			const footerTimestamp = document.getElementById('footerTimestamp');
			if (footerTimestamp) footerTimestamp.textContent = `Last updated: ${timestamp}`;
		}

		function updateHeaderUptime() {
			const now = new Date();
			const uptime = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
			const uptimeDisplay = document.getElementById('uptimeDisplay');
			if (uptimeDisplay) {
				uptimeDisplay.textContent = uptime;
			}
		}

		// Set up periodic updates
		document.addEventListener('DOMContentLoaded', function() {
			setTimeout(() => {
				updateCompactHeaderStatus();
				updateFooterStatus();
				updateHeaderUptime();

				setInterval(updateCompactHeaderStatus, 5000);
				setInterval(updateFooterStatus, 10000);
				setInterval(updateHeaderUptime, 60000);
			}, 1000);
		});
	</script>

</body>

</html>
