<!DOCTYPE HTML>
<html data-page="c6_diagnostic" data-page-title="C6 Quick Diagnostic">

<head>
    <meta charset="utf-8">
    <title>C6 Quick Diagnostic</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .status {
            padding: 10px;
            margin: 5px 0;
            border-radius: 4px;
        }

        .success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .warning {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            color: #856404;
        }

        .info {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }

        button {
            padding: 8px 16px;
            margin: 5px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-primary {
            background: #007bff;
            color: white;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        pre {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>

<body>
    <h1>🔧 C6 Module Quick Diagnostic</h1>

    <div class="status info">
        <strong>Status:</strong> <span id="status">Ready for testing</span>
    </div>

    <div>
        <button class="btn-primary" onclick="quickTest()">🚀 Quick Test</button>
        <button class="btn-success" onclick="fullTest()">🔍 Full Test</button>
        <button onclick="window.open('c6_function_test.html', '_blank')">📊 Open Test Suite</button>
    </div>

    <div id="results"></div>

    <script>
        function updateStatus(message, type = 'info') {
            const statusEl = document.getElementById('status');
            const statusDiv = statusEl.parentElement;
            statusEl.textContent = message;
            statusDiv.className = `status ${type}`;
        }

        function addResult(title, content, type = 'info') {
            const resultsDiv = document.getElementById('results');
            const resultDiv = document.createElement('div');
            resultDiv.className = `status ${type}`;
            resultDiv.innerHTML = `<strong>${title}:</strong><pre>${content}</pre>`;
            resultsDiv.appendChild(resultDiv);
        }

        async function quickTest() {
            document.getElementById('results').innerHTML = '';
            updateStatus('Running quick test...', 'info');

            // Test basic system info
            try {
                const response = await fetch('/sysinfo');
                const data = await response.json();

                if (response.ok) {
                    const c6Support = data.C6_OTA_FLASHING || data.hasC6;
                    addResult(
                        'System Info',
                        `Version: ${data.version || 'Unknown'}\nC6 Support: ${c6Support ? 'YES' : 'NO'}\nFree Heap: ${data.freeHeap ? Math.floor(data.freeHeap / 1024) + 'KB' : 'Unknown'}`,
                        c6Support ? 'success' : 'warning'
                    );

                    if (c6Support) {
                        updateStatus('✅ C6 support detected', 'success');
                        await testC6Connection();
                    } else {
                        updateStatus('⚠️ C6 support not detected', 'warning');
                    }
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
            } catch (error) {
                addResult('System Info', `Error: ${error.message}`, 'error');
                updateStatus('❌ System info test failed', 'error');
            }
        }

        async function testC6Connection() {
            try {
                const response = await fetch('/test_c6_connection');
                const data = await response.json();

                if (response.ok) {
                    const connected = data.connected;
                    addResult(
                        'C6 Connection',
                        `Connected: ${connected ? 'YES' : 'NO'}\nRSSI: ${data.rssi || 'Unknown'} dBm\nVersion: ${data.version ? '0x' + data.version.toString(16) : 'Unknown'}`,
                        connected ? 'success' : 'warning'
                    );

                    if (connected) {
                        updateStatus('✅ C6 module connected and responding', 'success');
                    } else {
                        updateStatus('⚠️ C6 module not responding', 'warning');
                    }
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
            } catch (error) {
                addResult('C6 Connection', `Error: ${error.message}`, 'error');
                updateStatus('❌ C6 connection test failed', 'error');
            }
        }

        async function fullTest() {
            document.getElementById('results').innerHTML = '';
            updateStatus('Running full diagnostic...', 'info');

            const endpoints = [
                { name: 'System Info', url: '/sysinfo', method: 'GET' },
                { name: 'C6 Connection', url: '/test_c6_connection', method: 'GET' },
                { name: 'C6 Settings', url: '/get_c6_settings', method: 'GET' },
                { name: 'AP List', url: '/ap_list', method: 'GET' },
                { name: 'Update Status', url: '/c6_update_status', method: 'GET' },
                { name: 'Drives List', url: '/list_drives', method: 'GET' },
                { name: 'Serial Ports', url: '/list_serial_ports', method: 'GET' }
            ];

            let passed = 0;
            let failed = 0;

            for (const endpoint of endpoints) {
                try {
                    const response = await fetch(endpoint.url);
                    const text = await response.text();

                    let data;
                    try {
                        data = JSON.parse(text);
                    } catch (e) {
                        data = text;
                    }

                    if (response.ok) {
                        addResult(
                            `${endpoint.name} (${endpoint.url})`,
                            typeof data === 'object' ? JSON.stringify(data, null, 2) : data,
                            'success'
                        );
                        passed++;
                    } else {
                        addResult(
                            `${endpoint.name} (${endpoint.url})`,
                            `HTTP ${response.status}: ${text}`,
                            'error'
                        );
                        failed++;
                    }
                } catch (error) {
                    addResult(
                        `${endpoint.name} (${endpoint.url})`,
                        `Error: ${error.message}`,
                        'error'
                    );
                    failed++;
                }

                // Small delay between requests
                await new Promise(resolve => setTimeout(resolve, 200));
            }

            updateStatus(`✅ ${passed} passed, ❌ ${failed} failed`, failed === 0 ? 'success' : 'warning');
        }

        // Auto-run quick test on load
        document.addEventListener('DOMContentLoaded', quickTest);
    </script>
    <script src="core/page-manifest.js"></script>
    <script src="core/boot.js"></script>
</body>

</html>
