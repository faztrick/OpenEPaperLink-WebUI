<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 DevWebUi</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
    <script src="layout-fix.js"></script>
    <script src="components/components.js" defer></script>
</head>

<body>
    <div id="app">
        <div data-include="header"></div>
        <div data-include="nav"></div>

        <!-- Main Content -->
        <div class="main-container container">
            <div data-include="sidebar"></div>

            <!-- Main Content Area -->
            <main class="main-content">
                <!-- Device Manager -->
                <div class="build-panel" id="device-manager">
                    <h2><i class="fas fa-plug"></i> Devices</h2>
                    <p style="color:#6b7280;margin-top:-6px">Save your devices (Name, Host/IP and COM). Select one to use across the Web UI.</p>

                    <div style="display:flex;justify-content:space-between;align-items:center;margin:6px 0 12px 0;gap:12px;flex-wrap:wrap">
                        <div class="muted" style="font-size:0.9rem">Selected device is used for API hints and actions.</div>
                        <button id="device-add" class="btn btn-success"><i class="fas fa-plus"></i> Add Device</button>
                    </div>

                    <div id="selected-device-card" style="margin-bottom:16px"></div>
                    <div id="saved-devices" class="device-grid"></div>
                    <!-- Inline Console Output under Devices -->
                    <div class="console-panel" style="margin-top:16px">
                        <div class="console-header">
                            <h3><i class="fas fa-terminal"></i> Console Output</h3>
                            <div class="console-controls">
                                <label for="log-source" class="muted" style="margin-right:6px">Log:</label>
                                <select id="log-source" title="Select server log to tail" style="padding:4px;border-radius:4px;border:1px solid #e5e7eb;background:#f3f4f6;color:#111;margin-right:6px">
                                    <option value="node">node</option>
                                    <option value="python">python</option>
                                    <option value="serial">serial</option>
                                    <option value="api">api</option>
                                    <option value="ws">ws</option>
                                    <option value="client">client</option>
                                    <option value="all">all</option>
                                </select>
                                <button id="start-tail" class="btn btn-small" title="Start tailing selected log">
                                    <i class="fas fa-stream"></i> Tail
                                </button>
                                <button id="stop-tail" class="btn btn-small" title="Stop tailing">
                                    <i class="fas fa-stop"></i> Stop Tail
                                </button>
                                <button id="clear-console" class="btn btn-small">
                                    <i class="fas fa-eraser"></i> Clear
                                </button>
                                <button id="save-log" class="btn btn-small">
                                    <i class="fas fa-save"></i> Save Log
                                </button>
                                <button id="kill-process" class="btn btn-danger btn-small" disabled>
                                    <i class="fas fa-stop"></i> Stop
                                </button>
                            </div>
                        </div>

                        <div id="console" class="console"></div>
                        <div class="console-tools-row">
                            <button id="console-collapse" class="console-toggle-btn" title="Collapse / expand console">Collapse</button>
                            <input id="console-search" class="console-search-input" placeholder="Search logs" title="Type to highlight" />
                            <button id="console-clear-search" class="btn btn-small" style="padding:4px 8px">✕</button>
                            <button id="console-export" class="btn btn-small" title="Download visible lines"><i class="fas fa-download"></i> Export</button>
                            <button id="console-explain-errors" class="btn btn-small" title="AI analyze recent errors"><i class="fas fa-lightbulb"></i> Explain Errors</button>
                        </div>
                        <div id="console-filters" class="console-filters" aria-label="Channel filters">
                            <div class="console-filter-chip active" data-chan="node">node</div>
                            <div class="console-filter-chip active" data-chan="python">python</div>
                            <div class="console-filter-chip active" data-chan="serial">serial</div>
                            <div class="console-filter-chip active" data-chan="api">api</div>
                            <div class="console-filter-chip active" data-chan="ws">ws</div>
                            <div class="console-filter-chip active" data-chan="client">client</div>
                        </div>
                        <div class="build-panel" style="margin-top:12px">
                            <h3 style="margin-bottom:8px"><i class="fas fa-vial"></i> Serial / API Tests</h3>
                            <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
                                <input id="serial-send-text" placeholder="Text to send over serial" style="padding:6px;min-width:220px" />
                                <button id="serial-open" class="btn btn-small"><i class="fas fa-plug"></i> Open Serial</button>
                                <button id="serial-close" class="btn btn-small"><i class="fas fa-power-off"></i> Close Serial</button>
                                <button id="serial-send-btn" class="btn btn-small"><i class="fas fa-paper-plane"></i> Send</button>
                                <select id="serial-quick-cmd" title="Quick serial commands" style="padding:4px;min-width:160px;border:1px solid #e5e7eb;border-radius:4px;background:#fff">
                                    <option value="">--cmd--</option>
                                </select>
                                <button id="serial-send-quick" class="btn btn-small" title="Send selected quick command"><i class="fas fa-bolt"></i> Quick</button>
                                <button id="serial-check" class="btn btn-small"><i class="fas fa-stethoscope"></i> COM Check</button>
                                <label style="display:flex;align-items:center;gap:4px;font-size:12px;color:#6b7280">
                                    <input type="checkbox" id="serial-auto-nl" style="margin:0"> NL
                                </label>
                                <select id="serial-baud" title="Baud Rate" style="padding:4px;min-width:90px;border:1px solid #e5e7eb;border-radius:4px;background:#fff">
                                    <option value="115200">115200</option>
                                    <option value="230400">230400</option>
                                    <option value="460800">460800</option>
                                    <option value="921600">921600</option>
                                </select>
                                <button id="serial-reopen" class="btn btn-small" title="Reopen with selected baud"><i class="fas fa-sync"></i> Reopen</button>
                                <button id="serial-diagnose" class="btn btn-small" title="Diagnose serial"><i class="fas fa-heartbeat"></i> Diagnose</button>
                                <span class="muted" id="serial-check-status"></span>
                            </div>
                            <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px">
                                <input id="test-host" placeholder="Device host/IP for API test" style="padding:6px;min-width:220px" />
                                <button id="btn-api-status" class="btn btn-small"><i class="fas fa-signal"></i> Test /api/status</button>
                                <button id="btn-wifi-scan" class="btn btn-small"><i class="fas fa-wifi"></i> Test WiFi Scan</button>
                                <span class="muted" id="api-test-status"></span>
                            </div>
                        </div>
                    </div>
                </div>



                <!-- (Removed duplicate Devices/COM panels) -->

            </main>
        </div>

        <div data-include="modals"></div>

        <!-- Device Add/Edit Modal -->
        <div id="device-modal" class="modal" style="display:none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="device-modal-title"><i class="fas fa-plug"></i> Add Device</h3>
                    <button class="modal-close" id="device-cancel">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="devName">Name</label>
                        <input id="devName" placeholder="My OutdoorAP" />
                    </div>
                    <div class="form-group">
                        <label for="devHost">Host/IP (host[:port])</label>
                        <input id="devHost" placeholder="192.168.4.1" />
                    </div>
                           <div class="form-group">
                               <label for="devCom">COM Port</label>
                               <select id="devCom"></select>
                           </div>
                           <div class="form-group" style="display:flex;gap:8px;align-items:center">
                               <button id="modal-wifi-setup" class="btn btn-secondary" type="button">
                                   <i class="fas fa-wifi"></i> WiFi Setup
                               </button>
                               <span class="muted" style="font-size:0.9rem">Launch quick WiFi scan for this host</span>
                           </div>
                </div>
                <div class="modal-footer" style="display:flex;justify-content:flex-end;gap:8px">
                    <button class="btn" id="device-cancel-btn">Cancel</button>
                    <button class="btn btn-primary" id="device-save-btn">Save</button>
                </div>
            </div>
        </div>

        <!-- Quick WiFi Scan Modal -->
        <div id="wifi-scan-modal" class="modal" style="display:none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="wifi-scan-title"><i class="fas fa-wifi"></i> WiFi Setup</h3>
                    <button class="modal-close" id="wifi-scan-close">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="wifi-scan-host">Device Host/IP</label>
                        <input id="wifi-scan-host" placeholder="192.168.4.1" />
                    </div>
                    <div class="form-group">
                        <label>Networks</label>
                        <div id="wifi-scan-status" class="muted" style="margin-bottom:6px"></div>
                        <div id="wifi-scan-list" style="max-height:260px;overflow:auto;border:1px solid #333;border-radius:6px;padding:8px;background:#0a0a0a"></div>
                    </div>
                    <div class="form-group">
                        <label for="wifi-scan-ssid">SSID</label>
                        <input id="wifi-scan-ssid" placeholder="Network name" />
                    </div>
                    <div class="form-group">
                        <label for="wifi-scan-pass">Password</label>
                        <input type="password" id="wifi-scan-pass" placeholder="••••••••" />
                    </div>
                </div>
                <div class="modal-footer" style="display:flex;justify-content:flex-end;gap:8px">
                    <button class="btn" id="wifi-scan-cancel">Cancel</button>
                    <button class="btn btn-primary" id="wifi-scan-send"><i class="fas fa-paper-plane"></i> Send</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <!-- Shared OEPL utilities (new) -->
    <script src="../shared/oepl-utils.js"></script>
    <script src="app.js"></script>
    <script src="device-sidebar.js"></script>
    <script src="spa.js"></script>
    <script src="shared-devices.js" defer></script>
    <!-- Floating AI Assistant Widget -->
    <script src="ai-agent-widget.js" defer></script>

</body>

</html>
