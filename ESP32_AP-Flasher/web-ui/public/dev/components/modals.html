<!-- Shared Modals Component -->
<div data-component-root="modals">
  <div id="progress-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="progress-title">Processing...</h3>
      </div>
      <div class="modal-body">
        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <div id="progress-text">Starting...</div>
      </div>
    </div>
  </div>
  <div id="ai-chat-modal" class="modal">
    <div class="modal-content ai-modal">
      <div class="modal-header">
        <h3><i class="fas fa-robot"></i> AI Assistant</h3>
        <button class="modal-close" id="ai-chat-close">&times;</button>
      </div>
      <div class="modal-body">
        <div id="ai-chat-messages" class="ai-chat-messages"></div>
        <div class="ai-chat-input">
          <input type="text" id="ai-input" placeholder="Ask about ESP32 development, errors, optimization..." />
          <button id="ai-send" class="btn btn-primary btn-small">
            <i class="fas fa-paper-plane"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
  <div id="ai-config-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3><i class="fas fa-robot"></i> AI Configuration</h3>
        <button class="modal-close" id="ai-config-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="ai-config-form">
          <!-- Content will be populated by existing JS (left intentionally minimal) -->
        </div>
      </div>
    </div>
  </div>
</div>
