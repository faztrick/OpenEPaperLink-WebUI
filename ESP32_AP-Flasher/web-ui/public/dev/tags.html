<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tags — OpenEPaperLink</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
  <script src="layout-fix.js"></script>
  <script src="components/components.js" defer></script>
  <script src="shared-devices.js" defer></script>
</head>
<body>
  <div data-include="header"></div>
  <div data-include="nav"></div>

  <main class="container" style="max-width:1200px;padding:16px">
    <div class="build-panel">
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <h2 style="margin:0"><i class="fas fa-tags"></i> Tags</h2>
        <button id="tags-refresh" class="btn small" title="Refresh now" style="display:flex;align-items:center;gap:6px"><i class="fas fa-rotate"></i><span>Refresh</span></button>
        <label style="display:flex;align-items:center;gap:4px;font-weight:normal;font-size:.9rem">Auto
          <select id="tags-autorefresh" style="padding:2px 4px">
            <option value="0">Off</option>
            <option value="10">10s</option>
            <option value="20" selected>20s</option>
            <option value="30">30s</option>
            <option value="60">60s</option>
          </select>
        </label>
        <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
          <input id="tags-filter" type="text" placeholder="Filter (MAC / alias / type)" style="padding:6px 8px;font-size:.9rem;min-width:240px">
        </div>
      </div>
      <p class="muted" id="tags-status" style="margin:8px 0 12px">Loading tag database…</p>
      <div class="table-wrapper" style="overflow:auto;max-height:60vh;border:1px solid var(--border-color,#444);border-radius:6px;background:#111">
        <table id="tags-table" style="width:100%;border-collapse:collapse;font-size:.85rem">
          <thead style="position:sticky;top:0;background:#1b1b1b;z-index:2">
            <tr>
              <th style="text-align:left;padding:8px 10px;border-bottom:1px solid #333">MAC</th>
              <th style="text-align:left;padding:8px 10px;border-bottom:1px solid #333">Alias</th>
              <th style="text-align:left;padding:8px 10px;border-bottom:1px solid #333">Type</th>
              <th style="text-align:left;padding:8px 10px;border-bottom:1px solid #333">Resolution</th>
              <th style="text-align:left;padding:8px 10px;border-bottom:1px solid #333">Colors</th>
              <th style="text-align:left;padding:8px 10px;border-bottom:1px solid #333">Battery</th>
              <th style="text-align:left;padding:8px 10px;border-bottom:1px solid #333">RSSI</th>
              <th style="text-align:left;padding:8px 10px;border-bottom:1px solid #333">Last Seen</th>
              <th style="text-align:left;padding:8px 10px;border-bottom:1px solid #333">Actions</th>
            </tr>
          </thead>
          <tbody id="tags-tbody"></tbody>
        </table>
      </div>
      <div id="tags-empty" style="display:none;padding:24px;text-align:center;color:#888">No tags found.</div>
      <div style="margin-top:12px;display:flex;gap:16px;flex-wrap:wrap;font-size:.75rem;color:#888">
        <div><strong>Newton M3 7.5"</strong> tags will appear with a special badge once first seen.</div>
        <div id="tags-summary"></div>
      </div>
    </div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
  <script src="tags.js" defer></script>
  <!-- Floating AI Assistant Widget -->
  <script src="ai-agent-widget.js" defer></script>
</body>
</html>
