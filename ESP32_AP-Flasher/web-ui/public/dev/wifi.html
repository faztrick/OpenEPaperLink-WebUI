<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 DevWebUi — WiFi Manager</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body>
  <!-- Centralized Header (matches dashboard) -->
  <header class="header">
    <div class="header-content">
      <div class="logo">
        <i class="fas fa-microchip"></i>
  <h1>ESP32 DevWebUi</h1>
      </div>
      <div class="status-indicators" style="display:flex;gap:10px;align-items:center">
        <div class="status-item" title="API">
          <span id="api-status-dot" class="status-dot disconnected"></span>
          <small id="api-status-text" style="margin-left:6px;color:#9ca3af">API(ip:port)</small>
        </div>

        <div class="status-item" title="WebSocket">
          <span id="ws-status-dot" class="status-dot disconnected"></span>
          <small id="ws-status-text" style="margin-left:6px;color:#9ca3af">WS(ip:port)</small>
        </div>

        <div class="status-item" title="Serial Port" style="display:flex;align-items:center;gap:8px">
          <span id="serial-status-dot" class="status-dot disconnected"></span>
          <small id="serial-status-text" style="color:#9ca3af">Serial (COM)</small>
          <select id="com-port-select" aria-label="COM port" style="margin-left:6px;padding:4px;border-radius:4px;border:1px solid #e5e7eb;background:white;color:#111"></select>
          <button id="com-refresh" title="Refresh COM list" style="padding:4px 6px;border-radius:4px;border:1px solid #e5e7eb;background:#f3f4f6;">⟳</button>
        </div>
      </div>
    </div>
  </header>
  <nav class="top-nav">
    <div class="container">
      <a href="index.html" class="nav-link">Dashboard</a>
      <a href="wifi.html" class="nav-link active">WiFi</a>
      <a href="tags.html" class="nav-link">Tags</a>
      <a href="ap-list.html" class="nav-link">AP List</a>
      <a href="peers.html" class="nav-link">Peers</a>
      <a href="flash.html" class="nav-link">Simple Flasher</a>
  <a href="device.html" class="nav-link">Device</a>
      <a href="settings.html" class="nav-link">Settings</a>
      <a href="ai.html" class="nav-link">AI</a>
    </div>
  </nav>
  <div class="container" style="max-width:1100px;padding:16px">
    <h1><i class="fas fa-wifi"></i> WiFi Manager</h1>
    <p class="muted">Select device, scan networks, and connect. Uses saved devices from Dashboard.</p>

    <div class="build-panel">
      <h3><i class="fas fa-plug"></i> Device</h3>
      <div style="display:flex;gap:12px;align-items:end;flex-wrap:wrap">
        <div class="form-group">
          <label for="wifi-device-select">Saved Device</label>
          <select id="wifi-device-select"></select>
        </div>
        <div class="form-group">
          <label for="wifi-host">Host (override)</label>
          <input id="wifi-host" placeholder="192.168.4.1">
        </div>
        <button id="wifi-use-selected" class="btn btn-small"><i class="fas fa-link"></i> Use Selected</button>
      </div>
    </div>

    <div class="build-panel">
      <h3><i class="fas fa-search"></i> Scan</h3>
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        <button id="wifi-scan" class="btn btn-primary"><i class="fas fa-wifi"></i> Scan Networks</button>
        <span id="wifi-scan-status" class="muted"></span>
      </div>
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:8px">
        <button id="wifi-serial-scan" class="btn"><i class="fas fa-usb"></i> Scan via Serial</button>
        <span id="wifi-serial-scan-status" class="muted"></span>
  <button id="wifi-serial-check" class="btn btn-small"><i class="fas fa-stethoscope"></i> Check COM</button>
  <span id="wifi-serial-check-status" class="muted"></span>
  <span class="muted">Using COM: <strong id="wifi-selected-com">-</strong></span>
      </div>
      <div id="wifi-list" style="margin-top:12px"></div>
    </div>

    <div class="build-panel">
      <h3><i class="fas fa-key"></i> Connect</h3>
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <div class="form-group">
          <label for="wifi-ssid">SSID</label>
          <input id="wifi-ssid" placeholder="SSID">
        </div>
        <div class="form-group">
          <label for="wifi-pass">Password</label>
          <input id="wifi-pass" placeholder="password (blank for open)" type="password">
        </div>
        <button id="wifi-connect" class="btn btn-success"><i class="fas fa-plug"></i> Connect</button>
        <button id="wifi-serial-connect" class="btn"><i class="fas fa-usb"></i> Connect via Serial</button>
        <span id="wifi-connect-status" class="muted"></span>
      </div>
    </div>

    <div class="console-panel">
      <div class="console-header">
        <h3><i class="fas fa-terminal"></i> Output</h3>
        <div class="console-controls">
          <button id="wifi-clear" class="btn btn-small"><i class="fas fa-eraser"></i> Clear</button>
        </div>
      </div>
      <div id="wifi-console" class="console"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
  <script src="wifi.js"></script>
</body>
</html>
