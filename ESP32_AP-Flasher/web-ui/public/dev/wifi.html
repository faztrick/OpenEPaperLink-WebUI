<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 DevWebUi — WiFi Manager</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
  <script src="layout-fix.js"></script>
  <script src="components/components.js" defer></script>
  <!-- Shared navigation (migration target) not yet implemented in dev section like device UI; keep existing header but minimized markup -->
  <!-- Shared utilities (device selection, status helpers) -->
  <script src="../shared/oepl-utils.js"></script>
  <script src="shared-devices.js" defer></script>
</head>
<body>
  <div data-include="header"></div>
  <div data-include="nav"></div>
  <!-- Unified device / comm toolbar (moved from header) -->
  <div class="device-toolbar-wrapper">
    <div class="device-toolbar" role="region" aria-label="Device Selection and Communication">
      <div class="dt-group">
        <label for="header-device-select" class="dt-label">Device</label>
        <select id="header-device-select" class="dt-select" aria-label="Saved device"></select>
      </div>
      <div class="dt-group">
        <label for="header-comm-mode" class="dt-label">Mode</label>
        <select id="header-comm-mode" class="dt-select" aria-label="Communication mode">
          <option value="serial">Serial</option>
          <option value="wifi">WiFi</option>
        </select>
      </div>
      <div class="dt-group">
        <label for="header-comm-port" class="dt-label">Port</label>
        <select id="header-comm-port" class="dt-select" aria-label="Serial port"></select>
      </div>
      <div class="dt-actions">
        <button id="device-add" class="btn btn-small btn-success" title="Add new device"><i class="fas fa-plus"></i> Add</button>
      </div>
    </div>
  </div>
  <main class="page-wrapper">
    <!-- Global Selected Device Sidebar (injected by device-sidebar.js) -->
    <aside id="selected-device-sidebar-host" style="display:none"></aside>
    <div class="page-header-row">
      <h1 class="page-title"><i class="fas fa-wifi"></i> WiFi Manager</h1>
      <div class="action-bar" role="toolbar" aria-label="WiFi actions">
        <button id="wifi-refresh-status" class="btn btn-small" title="Refresh status"><i class="fas fa-sync"></i><span>Status</span></button>
        <button id="wifi-scan" class="btn btn-small btn-primary" title="Network scan"><i class="fas fa-wifi"></i><span>Scan</span></button>
        <button id="wifi-serial-scan" class="btn btn-small" title="Serial scan"><i class="fas fa-usb"></i><span>Serial Scan</span></button>
        <button id="wifi-disconnect" class="btn btn-small btn-outline" title="Disconnect from WiFi"><i class="fas fa-unlink"></i><span>Disconnect</span></button>
        <button id="wifi-serial-check" class="btn btn-small" title="Check serial port"><i class="fas fa-stethoscope"></i><span>COM Check</span></button>
        <button id="wifi-clear" class="btn btn-small" title="Clear console"><i class="fas fa-eraser"></i><span>Clear</span></button>
      </div>
    </div>
    <p class="muted intro">Select a saved device, view status, scan networks and push credentials. Central device & communication controls are in the header.</p>

    <div class="wifi-grid">
      <!-- Left Column -->
      <div class="col">
        <div class="build-panel" id="wifi-status-panel">
          <h3 style="margin-top:0"><i class="fas fa-signal"></i> Current Status</h3>
          <div class="status-fields" id="wifi-status-fields" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;font-size:13px">
            <div><span class="muted">Connected</span><br><strong id="wifi-status-connected">?</strong></div>
            <div><span class="muted">SSID</span><br><strong id="wifi-status-ssid">-</strong></div>
            <div><span class="muted">IP</span><br><strong id="wifi-status-ip">-</strong></div>
            <div><span class="muted">RSSI</span><br><strong id="wifi-status-rssi">-</strong></div>
            <div><span class="muted">Channel</span><br><strong id="wifi-status-channel">-</strong></div>
            <div><span class="muted">Mode</span><br><strong id="wifi-status-mode">-</strong></div>
            <div><span class="muted">Updated</span><br><strong id="wifi-status-updated">-</strong></div>
          </div>
          <div style="margin-top:10px;font-size:12px;display:flex;gap:12px;flex-wrap:wrap" class="muted">
            <span id="wifi-disconnect-status"></span>
            <span id="wifi-scan-status"></span>
            <span id="wifi-serial-scan-status"></span>
            <span id="wifi-serial-check-status"></span>
            <span id="wifi-connect-status"></span>
          </div>
          <div style="margin-top:6px;font-size:12px" class="muted">Using COM: <strong id="wifi-selected-com">-</strong></div>
        </div>

        <div class="build-panel">
          <h3 style="margin-top:0"><i class="fas fa-key"></i> Credentials</h3>
          <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end">
            <div class="form-group" style="flex:1;min-width:200px">
              <label for="wifi-ssid">SSID</label>
              <input id="wifi-ssid" placeholder="SSID">
            </div>
            <div class="form-group" style="flex:1;min-width:200px">
              <label for="wifi-pass">Password</label>
              <input id="wifi-pass" placeholder="password (blank for open)" type="password">
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              <button id="wifi-connect" class="btn btn-success btn-small"><i class="fas fa-plug"></i> Send</button>
              <button id="wifi-serial-connect" class="btn btn-small"><i class="fas fa-usb"></i> Serial Send</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Right Column -->
      <div class="col">
        <div class="build-panel" style="min-height:240px">
          <h3 style="margin-top:0"><i class="fas fa-search"></i> Scan Results</h3>
          <div id="wifi-list" style="margin-top:4px;min-height:140px"></div>
        </div>
        <div class="console-panel" style="margin-top:16px">
          <div class="console-header">
            <h3><i class="fas fa-terminal"></i> Output</h3>
            <div class="console-controls"></div>
          </div>
          <div id="wifi-console" class="console"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="dev-common.js"></script>
  <script src="app.js"></script>
  <script src="spa.js"></script>
  <script src="device-sidebar.js"></script>
  <script src="wifi.js"></script>
  <!-- Floating AI Assistant Widget -->
  <script src="ai-agent-widget.js" defer></script>
</body>
</html>
