<!-- Universal Header Include
     This file provides a consistent header structure across all pages
     Usage: Include this file in all HTML pages for consistent header layout
-->

<!-- Load universal menu script if not already loaded -->
<script>
    if (!document.querySelector('script[src*="universal-menu.js"]')) {
        const script = document.createElement('script');
        script.src = 'universal-menu.js';
        script.defer = true;
        document.head.appendChild(script);
    }
</script>

<!-- Compact Single-Line Header: Logo + Navigation + Status -->
<header class="advanced-header compact-header">
    <div class="compact-header-content">
        <!-- Single Line: Logo + Menu + Status -->
        <div class="header-single-line">
            <!-- Left: Logo -->
            <div class="header-left">
                <div class="logo-section">
                    <div class="logo-icon" id="page-icon">⚡</div>
                    <div class="logo-text">
                        <h1 id="page-title">OpenEPL ESP32</h1>
                        <span class="version" id="page-version">v3.1</span>
                    </div>
                </div>
            </div>

            <!-- Center: Navigation Menu -->
            <div class="header-center">
                <div id="menu-container" class="menu-container"></div>
            </div>

            <!-- Right: Compact Status -->
            <div class="header-right">
                <div class="compact-status">
                    <div class="status-group">
                        <div class="status-dot" id="systemDot"></div>
                        <span id="systemStatus">Ready</span>
                    </div>
                    <div class="status-separator">|</div>
                    <div class="status-group">
                        <span class="material-symbols-outlined">devices</span>
                        <span id="tagCount">0</span>
                    </div>
                    <div class="status-separator">|</div>
                    <div class="status-group">
                        <span class="material-symbols-outlined">wifi</span>
                        <span id="wifiStatus">WiFi</span>
                    </div>
                    <div class="status-separator">|</div>
                    <div class="status-group">
                        <span class="material-symbols-outlined">schedule</span>
                        <span id="uptimeDisplay">--:--</span>
                    </div>
                </div>

                <!-- Quick Actions -->
                <div class="quick-actions">
                    <button class="action-btn" onclick="refreshData()" title="Refresh Data">
                        <span class="material-symbols-outlined">refresh</span>
                    </button>
                    <button class="action-btn" onclick="findAllTags()" title="Find All Tags">
                        <span class="material-symbols-outlined">search</span>
                    </button>
                    <button class="action-btn" onclick="toggleCompactMode()" title="Toggle Compact Mode">
                        <span class="material-symbols-outlined">fullscreen</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</header>

<script>
    // Universal Header Configuration
    // This script allows each page to customize the header content
    (function () {
        // Page-specific header configuration
        const pageConfigs = {
            'index.html': {
                icon: '📱',
                title: 'OpenEPL ESP32',
                version: 'v3.1'
            },
            'settings.html': {
                icon: '⚙️',
                title: 'OpenEPL Settings',
                version: 'v3.1'
            },
            'logs.html': {
                icon: '📋',
                title: 'OpenEPL System Logs',
                version: 'v3.1'
            },
            'setup.html': {
                icon: '�',
                title: 'OpenEPL WiFi Setup',
                version: 'v3.1'
            },
            'esp32_endpoint_checker.html': {
                icon: '�',
                title: 'ESP32 Endpoint Checker',
                version: 'v3.1'
            },
            'network-test.html': {
                icon: '🌐',
                title: 'Network Connection Test',
                version: 'v3.1'
            }
        };

        // Get current page name
        const currentPage = window.location.pathname.split('/').pop() || 'index.html';
        const config = pageConfigs[currentPage] || pageConfigs['index.html'];

        // Wait for DOM to be ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', updateHeader);
        } else {
            updateHeader();
        }

        function updateHeader() {
            // Update page-specific elements
            const pageIcon = document.getElementById('page-icon');
            const pageTitle = document.getElementById('page-title');
            const pageVersion = document.getElementById('page-version');

            if (pageIcon) pageIcon.textContent = config.icon;
            if (pageTitle) pageTitle.textContent = config.title;
            if (pageVersion) pageVersion.textContent = config.version;

            // Initialize universal menu if not already loaded
            if (typeof initializeUniversalMenu === 'function') {
                initializeUniversalMenu();
            } else {
                // If universal-menu.js hasn't loaded yet, wait for it
                const checkForMenu = () => {
                    if (typeof initializeUniversalMenu === 'function') {
                        initializeUniversalMenu();
                    } else {
                        setTimeout(checkForMenu, 50);
                    }
                };
                checkForMenu();
            }

            // Mark current page as active in menu
            setTimeout(() => {
                const menuBtns = document.querySelectorAll('.menu-btn');
                menuBtns.forEach(btn => {
                    const dataPage = btn.getAttribute('data-page');
                    if (dataPage && currentPage.includes(dataPage)) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
            }, 100);
        }

        // Expose function globally for manual updates
        window.updateUniversalHeader = updateHeader;
    })();
</script>
