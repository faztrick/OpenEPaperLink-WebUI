<!DOCTYPE HTML>
<html>

<head>
        <meta http-equiv="content-type" content="text/html; charset=utf-8">
        <meta name="viewport" content="width=" device-width," initial-scale="1," maximum-scale="1," user-scalable=0" />

        <title>WiFi Setup - OpenEPL ESP32 Access Point</title>

        <!-- Core Stylesheets -->
        <link rel="stylesheet" href="merged-styles.css?3.2" type="text/css" />
        <link rel="icon" type="image/vnd.icon" href="favicon.ico">
        <link rel="stylesheet"
                href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
                rel="stylesheet">

        <!-- Core JavaScript Modules -->
        <script src="shared-utils.js?3.2" defer></script>
        <script src="constants.js?3.2" defer></script>
        <script src="utils.js?3.2" defer></script>
        <script src="api-manager.js?3.2" defer></script>
        <script src="endpoint-fix.js?3.2" defer></script>
        <script src="universal-menu.js?3.2" defer></script>
        <script src="setup.js?3.2" defer></script>
</head>

<body>
        <!-- Universal Header -->
        <div id="universal-header-placeholder"></div>

        <!-- Navigation Back Button -->
        <button class="nav-back" onclick="window.location.href='index.html'">
                <span class="material-symbols-outlined">arrow_back</span>
                Back to Dashboard
        </button>

        <!-- Main Content -->
        <div class="universal-container" style="max-width: 800px;">
                <!-- Page Header -->
                <div class="glass-card page-header">
                        <h1>WiFi Configuration</h1>
                        <div class="subtitle">Configure your ESP32's WiFi connection settings</div>
                </div>

                <!-- WiFi Configuration Card -->
                <div class="glass-card">
                        <!-- MAC Address Display -->
                        <div class="form-group">
                                <label>WiFi MAC Address:</label>
                                <div style="font-family: monospace; color: var(--accent-color); font-weight: 600;"
                                        id="mac">
                                        Loading...
                                </div>
                        </div>

                        <!-- WiFi Status -->
                        <div id="wifi_status" class="wifi-info" style="display: none;">
                                <strong>WiFi Status:</strong> <span id="wifi_status_text">Checking...</span>
                        </div>

                        <!-- WiFi Credentials -->
                        <div class="form-row">
                                <label for="ssid">SSID:</label>
                                <input type="text" id="ssid" placeholder="Enter WiFi network name">
                                <button id="listssid" class="btn secondary">
                                        <span class="material-symbols-outlined">search</span>
                                        Find Networks
                                </button>
                        </div>

                        <div class="form-row">
                                <label for="pw">Password:</label>
                                <input type="password" id="pw" placeholder="Enter WiFi password">
                        </div>

                        <!-- Scan Status -->
                        <div id="scan_status"></div>

                        <!-- Static IP Configuration -->
                        <div style="margin-top: var(--spacing-lg);">
                                <h3 style="color: var(--text-secondary); margin-bottom: var(--spacing-md);">
                                        Static IP Configuration (Optional)
                                </h3>
                                <p style="color: var(--text-muted); margin-bottom: var(--spacing-md);">
                                        Fill in the fields below for static IP configuration. Leave empty for DHCP.
                                </p>

                                <div class="form-row">
                                        <label for="ip">Static IP:</label>
                                        <input type="text" id="ip" placeholder="192.168.1.100">
                                </div>

                                <div class="form-row">
                                        <label for="mask">Subnet Mask:</label>
                                        <input type="text" id="mask" placeholder="255.255.255.0">
                                </div>

                                <div class="form-row">
                                        <label for="gw">Gateway:</label>
                                        <input type="text" id="gw" placeholder="192.168.1.1">
                                </div>

                                <div class="form-row">
                                        <label for="dns">DNS:</label>
                                        <input type="text" id="dns" placeholder="8.8.8.8">
                                </div>
                        </div>

                        <!-- Save Button -->
                        <div style="margin-top: var(--spacing-lg); text-align: center;">
                                <button id="connect" class="btn success">
                                        <span class="material-symbols-outlined">save</span>
                                        Save WiFi Settings and Reboot
                                </button>
                        </div>

                        <!-- Save Status -->
                        <div id="save_status"></div>
                </div>
        </div>

        <!-- Universal Scripts -->
        <script>
                // Load universal header
                function loadUniversalHeader() {
                        fetch('universal-header.html')
                                .then(response => response.text())
                                .then(html => {
                                        const placeholder = document.getElementById('universal-header-placeholder');
                                        if (placeholder) {
                                                placeholder.innerHTML = html;
                                        }
                                })
                                .catch(error => {
                                        console.warn('Could not load universal header:', error);
                                });
                }

                // Initialize on DOM ready
                document.addEventListener('DOMContentLoaded', function () {
                        loadUniversalHeader();
                });
        </script>
</body>

</html>
