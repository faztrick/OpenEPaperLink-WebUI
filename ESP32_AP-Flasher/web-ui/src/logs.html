<body>
	<!-- Universal Header -->
	<div id="universal-header-placeholder"></div>

	<!-- Navigation Back Button -->
	<button class="nav-back" onclick="window.location.href='index.html'">
		<span class="material-symbols-outlined">arrow_back</span>
		Back to Dashboard
	</button>

	<!-- Main Content -->
	<div class="universal-container">
		<!-- Page Header -->
		<div class="glass-card page-header">
			<h1>System Logs</h1>
			<div class="subtitle">Monitor system activity and debug information</div>
		</div>

		<!-- Log Controls -->
		<div class="glass-card">
			<div class="log-controls">
				<div class="left-controls">
					<div class="checkbox-group">
						<input type="checkbox" id="autoscroll" checked>
						<label for="autoscroll">Auto-scroll</label>
					</div>
					<div class="checkbox-group">
						<input type="checkbox" id="timestamps" checked>
						<label for="timestamps">Show timestamps</label>
					</div>
				</div>
				<div class="right-controls">
					<button onclick="clearLogs()">
						<span class="material-symbols-outlined">clear_all</span>
						Clear
					</button>
					<button onclick="refreshLogs()">
						<span class="material-symbols-outlined">refresh</span>
						Refresh
					</button>
					<button onclick="downloadLogs()">
						<span class="material-symbols-outlined">download</span>
						Download
					</button>
				</div>
			</div>

			<!-- Log Display -->
			<ul id="messages" class="log-display">
				<li class="info">System logs will appear here...</li>
			</ul>
		</div>
	</div>

	<!-- Universal Scripts -->
	<script>
		// Load universal header
		function loadUniversalHeader() {
			fetch('universal-header.html')
				.then(response => response.text())
				.then(html => {
					const placeholder = document.getElementById('universal-header-placeholder');
					if (placeholder) {
						placeholder.innerHTML = html;
					}
				})
				.catch(error => {
					console.warn('Could not load universal header:', error);
				});
		}

		// Log management functions
		function clearLogs() {
			const messages = document.getElementById('messages');
			if (messages) {
				messages.innerHTML = '<li class="info">Logs cleared</li>';
			}
		}

		function refreshLogs() {
			// Trigger log refresh
			if (typeof window.refreshLogData === 'function') {
				window.refreshLogData();
			}
		}

		function downloadLogs() {
			const messages = document.getElementById('messages');
			if (messages) {
				const logText = messages.innerText;
				const blob = new Blob([logText], { type: 'text/plain' });
				const url = URL.createObjectURL(blob);
				const a = document.createElement('a');
				a.href = url;
				a.download = `esp32-logs-${new Date().toISOString().split('T')[0]}.txt`;
				document.body.appendChild(a);
				a.click();
				document.body.removeChild(a);
				URL.revokeObjectURL(url);
			}
		}

		// Initialize on DOM ready
		document.addEventListener('DOMContentLoaded', function () {
			loadUniversalHeader();
		});
	</script>
</body>

</html>

<script>
	// Application initialization with proper script loading wait
	document.addEventListener('DOMContentLoaded', function () {
		// Wait for essential classes to be loaded
		const waitForClasses = () => {
			const requiredClasses = ['tagDB', 'loadTags'];
			const allLoaded = requiredClasses.every(className => typeof window[className] !== 'undefined');

			if (allLoaded) {
				// Initialize logs functionality
				try {
					if (typeof loadTags === 'function') {
						loadTags(0);
					}

					// Initialize logs-specific functionality
					if (typeof window.initLogsPage === 'function') {
						window.initLogsPage();
					}
				} catch (error) {
					console.error('Failed to initialize logs page:', error);
				}
			} else {
				// Check again in 100ms
				setTimeout(waitForClasses, 100);
			}
		};

		waitForClasses();
	});

	// Update status functions
	function updateCompactHeaderStatus() {
		fetch('get_ap_config')
			.then(response => response.json())
			.then(data => {
				const systemDot = document.getElementById('systemDot');
				const systemStatus = document.getElementById('systemStatus');
				const tagCount = document.getElementById('tagCount');
				const wifiStatus = document.getElementById('wifiStatus');

				if (systemDot && systemStatus && data.apstate !== undefined) {
					if (data.apstate === 1) {
						systemDot.className = 'status-dot online';
						systemStatus.textContent = 'Online';
					} else if (data.apstate === 2) {
						systemDot.className = 'status-dot warning';
						systemStatus.textContent = 'Flashing';
					} else if (data.apstate === 5) {
						systemDot.className = 'status-dot offline';
						systemStatus.textContent = 'Failed';
					} else {
						systemDot.className = 'status-dot warning';
						systemStatus.textContent = 'Starting';
					}
				}

				if (tagCount) {
					const totalTags = Object.keys(tagDB || {}).length;
					tagCount.textContent = `${totalTags} Tags`;
				}

				if (wifiStatus) {
					wifiStatus.textContent = data.wifiConnected ? 'Connected' : 'Disconnected';
				}
			})
			.catch(error => {
				console.error('Status update error:', error);
			});
	}

	function updateFooterStatus() {
		const timestamp = new Date().toLocaleTimeString();
		const footerTimestamp = document.getElementById('footerTimestamp');
		if (footerTimestamp) footerTimestamp.textContent = `Last updated: ${timestamp}`;
	}

	function updateHeaderUptime() {
		const now = new Date();
		const uptime = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
		const uptimeDisplay = document.getElementById('uptimeDisplay');
		if (uptimeDisplay) {
			uptimeDisplay.textContent = uptime;
		}
	}

	// Set up periodic updates
	document.addEventListener('DOMContentLoaded', function () {
		setTimeout(() => {
			updateCompactHeaderStatus();
			updateFooterStatus();
			updateHeaderUptime();

			setInterval(updateCompactHeaderStatus, 5000);
			setInterval(updateFooterStatus, 10000);
			setInterval(updateHeaderUptime, 60000);
		}, 1000);
	});
</script>
