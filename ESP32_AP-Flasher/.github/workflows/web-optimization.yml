name: 'Web Assets Optimization'

on:
  push:
    paths:
      - 'wwwroot/**'
      - 'web-ui/**'
  pull_request:
    paths:
      - 'wwwroot/**'
      - 'web-ui/**'
  workflow_dispatch:

jobs:
  optimize-assets:
    name: 'Optimize Web Assets'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install optimization tools
      run: |
        npm install -g uglify-js clean-css-cli html-minifier-terser

    - name: Optimize JavaScript files
      run: |
        mkdir -p optimized/wwwroot
        for file in wwwroot/*.js; do
          if [ -f "$file" ]; then
            filename=$(basename "$file")
            uglifyjs "$file" --compress --mangle --output "optimized/wwwroot/$filename"
            echo "Optimized: $filename"
          fi
        done

    - name: Optimize CSS files
      run: |
        for file in wwwroot/*.css; do
          if [ -f "$file" ]; then
            filename=$(basename "$file")
            cleancss "$file" --output "optimized/wwwroot/$filename"
            echo "Optimized: $filename"
          fi
        done

    - name: Optimize HTML files
      run: |
        for file in wwwroot/*.html; do
          if [ -f "$file" ]; then
            filename=$(basename "$file")
            html-minifier-terser "$file" \
              --collapse-whitespace \
              --remove-comments \
              --remove-optional-tags \
              --remove-redundant-attributes \
              --remove-script-type-attributes \
              --remove-tag-whitespace \
              --use-short-doctype \
              --minify-css true \
              --minify-js true \
              --output "optimized/wwwroot/$filename"
            echo "Optimized: $filename"
          fi
        done

    - name: Create compression report
      run: |
        echo "# Web Assets Optimization Report" > optimization-report.md
        echo "" >> optimization-report.md
        echo "| File | Original Size | Optimized Size | Savings |" >> optimization-report.md
        echo "|------|---------------|----------------|---------|" >> optimization-report.md

        for file in wwwroot/*.{js,css,html}; do
          if [ -f "$file" ]; then
            filename=$(basename "$file")
            original_size=$(stat -c%s "$file" 2>/dev/null || echo "0")
            optimized_file="optimized/wwwroot/$filename"
            if [ -f "$optimized_file" ]; then
              optimized_size=$(stat -c%s "$optimized_file")
              savings=$((original_size - optimized_size))
              savings_percent=$((savings * 100 / original_size))
              echo "| $filename | ${original_size}B | ${optimized_size}B | ${savings}B (${savings_percent}%) |" >> optimization-report.md
            fi
          fi
        done

    - name: Upload optimized assets
      uses: actions/upload-artifact@v4
      with:
        name: optimized-web-assets
        path: |
          optimized/
          optimization-report.md

  gzip-compression:
    name: 'GZIP Compression Test'
    runs-on: ubuntu-latest
    needs: optimize-assets

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download optimized assets
      uses: actions/download-artifact@v4
      with:
        name: optimized-web-assets

    - name: Test GZIP compression
      run: |
        echo "# GZIP Compression Analysis" > gzip-report.md
        echo "" >> gzip-report.md
        echo "| File | Original | GZIP | Compression Ratio |" >> gzip-report.md
        echo "|------|----------|------|-------------------|" >> gzip-report.md

        for file in optimized/wwwroot/*; do
          if [ -f "$file" ]; then
            filename=$(basename "$file")
            original_size=$(stat -c%s "$file")
            gzip -k "$file"
            gzip_size=$(stat -c%s "$file.gz")
            ratio=$((100 - gzip_size * 100 / original_size))
            echo "| $filename | ${original_size}B | ${gzip_size}B | ${ratio}% |" >> gzip-report.md
          fi
        done

    - name: Upload GZIP analysis
      uses: actions/upload-artifact@v4
      with:
        name: gzip-compression-report
        path: gzip-report.md
