name: 'ESP32 OpenEPL - Build and Test'

on:
  push:
    branches: [ main, develop, ss ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  html-js-validation:
    name: 'HTML/JS Code Quality'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm install -g htmlhint jshint prettier

    - name: Validate HTML files
      run: |
        find wwwroot -name "*.html" -exec htmlhint {} \;
        find web-ui/src -name "*.html" -exec htmlhint {} \;

    - name: Validate JavaScript files
      run: |
        find wwwroot -name "*.js" -exec jshint {} \;
        find web-ui/src -name "*.js" -exec jshint {} \;

    - name: Check code formatting
      run: |
        prettier --check "wwwroot/**/*.{html,js,css}"
        prettier --check "web-ui/src/**/*.{html,js,css}"

  platformio-build:
    name: 'PlatformIO Build'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [OutdoorAP, ESP32_C6, ESP32_S3_C6_NANO_AP]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

    - name: Cache PlatformIO
      uses: actions/cache@v4
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-pio

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio

    - name: Build firmware
      run: |
        pio run -e ${{ matrix.environment }}

    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ matrix.environment }}
        path: |
          .pio/build/${{ matrix.environment }}/*.bin
          .pio/build/${{ matrix.environment }}/firmware.elf

  web-ui-build:
    name: 'Web UI Build'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      working-directory: web-ui
      run: |
        if [ -f package.json ]; then
          npm install
        fi

    - name: Build web UI
      working-directory: web-ui
      run: |
        if [ -f package.json ]; then
          npm run build
        fi

    - name: Test web files
      run: |
        echo "Testing web file integrity..."
        for file in wwwroot/*.html; do
          if [ -f "$file" ]; then
            echo "Checking $file"
            # Basic HTML structure validation
            if ! grep -q "<!DOCTYPE" "$file"; then
              echo "Warning: $file missing DOCTYPE"
            fi
            if ! grep -q "</html>" "$file"; then
              echo "Warning: $file missing closing html tag"
            fi
          fi
        done

    - name: Compress web assets
      run: |
        # Compress JavaScript and HTML files
        find wwwroot -name "*.js" -exec gzip -k {} \;
        find wwwroot -name "*.html" -exec gzip -k {} \;
        find wwwroot -name "*.css" -exec gzip -k {} \;

    - name: Upload web assets
      uses: actions/upload-artifact@v4
      with:
        name: web-assets
        path: |
          wwwroot/
          web-ui/dist/

  code-analysis:
    name: 'Code Analysis'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run CodeQL Analysis
      uses: github/codeql-action/init@v3
      with:
        languages: cpp, javascript

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

  security-scan:
    name: 'Security Scan'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'

  integration-tests:
    name: 'Integration Tests'
    runs-on: ubuntu-latest
    needs: [html-js-validation, web-ui-build]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python for testing
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install test dependencies
      run: |
        pip install requests pytest

    - name: Run validation scripts
      run: |
        if [ -f validate_config.py ]; then
          python validate_config.py
        fi
        if [ -f validate_modules.py ]; then
          python validate_modules.py
        fi
        if [ -f validate_wifi_cleanup.py ]; then
          python validate_wifi_cleanup.py
        fi

    - name: Test web endpoints simulation
      run: |
        echo "Running web endpoint simulation tests..."
        python3 -c "
        import json
        import os

        # Test configuration files
        config_files = ['data/languages.json', 'data/tag_md5_db.json', 'data/update_actions.json']
        for config_file in config_files:
            if os.path.exists(config_file):
                try:
                    with open(config_file, 'r') as f:
                        json.load(f)
                    print('✓ {} is valid JSON'.format(config_file))
                except json.JSONDecodeError as e:
                    print('✗ {} has JSON error: {}'.format(config_file, e))
                    exit(1)
            else:
                print('! {} not found'.format(config_file))

        print('All configuration files validated')
        "

  release:
    name: 'Create Release'
    runs-on: ubuntu-latest
    needs: [platformio-build, web-ui-build, integration-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Create release package
      run: |
        mkdir -p release

        # Copy firmware files
        cp -r firmware-*/*.bin release/ 2>/dev/null || true
        cp -r firmware-*/*.elf release/ 2>/dev/null || true

        # Copy web assets
        cp -r web-assets/wwwroot release/ 2>/dev/null || true

        # Create version info
        echo "Build Date: $(date)" > release/BUILD_INFO.txt
        echo "Commit: $GITHUB_SHA" >> release/BUILD_INFO.txt
        echo "Branch: $GITHUB_REF_NAME" >> release/BUILD_INFO.txt

        # Create archive
        tar -czf openeplink-esp32-$(date +%Y%m%d).tar.gz -C release .

    - name: Upload release assets
      uses: actions/upload-artifact@v4
      with:
        name: release-package
        path: |
          openeplink-esp32-*.tar.gz
          release/BUILD_INFO.txt
