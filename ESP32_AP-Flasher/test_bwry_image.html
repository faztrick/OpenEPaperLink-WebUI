<!DOCTYPE html>
<html>

<head>
    <title>BWRY Test Image Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        canvas {
            border: 1px solid #ccc;
            margin: 10px 0;
        }

        .controls {
            margin: 10px 0;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
        }

        .color-info {
            background: #f0f0f0;
            padding: 10px;
            margin: 10px 0;
        }
    </style>
</head>

<body>
    <h1>Solum M3 7.5" BWRY Test Image Generator</h1>

    <div class="color-info">
        <h3>Supported Colors for Newton M3 7.5" BWRY:</h3>
        <ul>
            <li><strong>Black:</strong> RGB(0,0,0)</li>
            <li><strong>White:</strong> RGB(255,255,255)</li>
            <li><strong>Red:</strong> RGB(255,0,0)</li>
            <li><strong>Yellow:</strong> RGB(255,255,0)</li>
        </ul>
    </div>

    <div class="controls">
        <button onclick="generateTestPattern()">Generate Test Pattern</button>
        <button onclick="downloadImage()">Download Test Image</button>
    </div>

    <canvas id="testCanvas" width="800" height="480"></canvas>

    <script>
        const canvas = document.getElementById('testCanvas');
        const ctx = canvas.getContext('2d');

        function generateTestPattern() {
            // Clear canvas with white background
            ctx.fillStyle = 'rgb(255,255,255)';
            ctx.fillRect(0, 0, 800, 480);

            // Create test pattern with 4 colors

            // Title bar in black
            ctx.fillStyle = 'rgb(0,0,0)';
            ctx.fillRect(0, 0, 800, 60);

            // White text on black background
            ctx.fillStyle = 'rgb(255,255,255)';
            ctx.font = 'bold 36px Arial';
            ctx.fillText('Newton M3 7.5" BWRY Test', 20, 40);

            // Red section
            ctx.fillStyle = 'rgb(255,0,0)';
            ctx.fillRect(0, 60, 400, 210);
            ctx.fillStyle = 'rgb(255,255,255)';
            ctx.font = 'bold 48px Arial';
            ctx.fillText('RED', 150, 180);

            // Yellow section  
            ctx.fillStyle = 'rgb(255,255,0)';
            ctx.fillRect(400, 60, 400, 210);
            ctx.fillStyle = 'rgb(0,0,0)';
            ctx.font = 'bold 48px Arial';
            ctx.fillText('YELLOW', 480, 180);

            // Info section in white with black text
            ctx.fillStyle = 'rgb(255,255,255)';
            ctx.fillRect(0, 270, 800, 210);
            ctx.fillStyle = 'rgb(0,0,0)';
            ctx.font = '24px Arial';
            ctx.fillText('Display Resolution: 800x480 pixels', 50, 320);
            ctx.fillText('Color Support: 4 colors (BWRY)', 50, 360);
            ctx.fillText('Hardware Type: 14 (0x0E)', 50, 400);
            ctx.fillText('Template Content IDs: 1-27 supported', 50, 440);

            // Corner markers in alternating colors
            ctx.fillStyle = 'rgb(255,0,0)';
            ctx.fillRect(0, 0, 20, 20);
            ctx.fillStyle = 'rgb(255,255,0)';
            ctx.fillRect(780, 0, 20, 20);
            ctx.fillStyle = 'rgb(0,0,0)';
            ctx.fillRect(0, 460, 20, 20);
            ctx.fillStyle = 'rgb(255,0,0)';
            ctx.fillRect(780, 460, 20, 20);
        }

        function downloadImage() {
            const link = document.createElement('a');
            link.download = 'newton_m3_bwry_test.png';
            link.href = canvas.toDataURL();
            link.click();
        }

        // Generate initial test pattern
        generateTestPattern();
    </script>
</body>

</html>
