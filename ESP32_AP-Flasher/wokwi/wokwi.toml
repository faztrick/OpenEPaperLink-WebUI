# Wokwi ESP32-S3 Project Configuration
# This file configures the ESP32-S3 simulation environment

[esp32]
# ESP32-S3 specific configuration
model = "esp32-s3"
revision = 0
flash_size = 32MB
psram_size = 8MB

# Clock configuration
cpu_freq_mhz = 240
flash_freq_mhz = 80

# GPIO configuration matching your hardware
gpio_13 = "spi_mosi"     # TFT MOSI  
gpio_12 = "spi_sclk"     # TFT SCLK
gpio_10 = "spi_cs"       # TFT CS
gpio_11 = "spi_dc"       # TFT DC
gpio_1 = "reset"         # TFT RST
gpio_38 = "neopixel"     # RGB LED
gpio_21 = "status_led"   # Status LED
gpio_17 = "uart_tx"      # Flasher TXD
gpio_18 = "uart_rx"      # Flasher RXD  
gpio_47 = "flasher_reset" # Flasher Reset

# UART configuration
uart0_baudrate = 115200
uart1_baudrate = 115200

# SPI configuration for display
spi2_frequency = 40000000

# WiFi configuration (simulated)
wifi_enabled = true
wifi_ssid = "WokwiAP"
wifi_password = "wokwi123"

# Debugging configuration
gdb_port = 3334
gdb_enabled = true

# Simulation options
real_time_simulation = false
enable_brownout_detector = true
enable_watchdog = true

# Memory configuration  
heap_size = 320KB
stack_size = 8KB

# Peripheral simulation
enable_gpio_interrupts = true
enable_timer_interrupts = true
enable_uart_simulation = true
enable_spi_simulation = true

# Performance options
instruction_cache = true
data_cache = true
branch_prediction = true
