; Try to not create new configs if possible, if in doubt, please ask
; OTA on the official repo will only be published for mass-produced APs, feel free to experiment on your own fork
[env]
; Choose below between platformio/espressif32 (Arduino 2.x) and pioarduino (Arduino 3.x)
; Updated to latest stable platform for better performance and security
platform = platformio/espressif32@^6.10.0
;platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
lib_deps =
	; Core async web server libraries - latest versions
	ESP32Async/AsyncTCP@^1.1.4
	ESP32Async/ESPAsyncWebServer@^3.5.13
	
	; JSON handling - latest ArduinoJson with performance improvements
	bblanchon/ArduinoJson@^7.2.1
	
	; Display libraries - updated for better performance
	bodmer/TFT_eSPI@^2.5.43
	https://github.com/Bodmer/TJpg_Decoder.git
	
	; XML and QR code - maintained versions
	https://github.com/nlimper/shoddyxml2#d19a4e5
	https://github.com/nlimper/QRCodeGenerator
	
	; LED control - latest stable version with ESP32-S3 optimizations
	fastled/FastLED@^3.9.17
	
	; SPI library - maintained version
	https://github.com/MajenkoLibraries/SoftSPI
	
	; Advanced libraries for enhanced functionality
	; High-performance logging library
	adafruit/Adafruit BusIO@^1.16.2
	
	; Enhanced WiFi management with modern features
	tzapu/WiFiManager@^2.0.17
	
	; Advanced OTA library with better error handling
	ayushsharma82/ElegantOTA@^3.1.5
	
	; Modern task scheduler for better multitasking
	arkhipenko/TaskScheduler@^3.8.5
	
	; Enhanced SPIFFS/LittleFS utilities
	lorol/LittleFS_esp32@^1.0.6
	
	; Advanced networking utilities
	dancol90/ESP32Ping@^1.7.0
	
	; Modern configuration management
	vshymanskyy/Preferences@^2.1.0
	
	; Enhanced memory management
	links2004/MemoryObserver@^1.0.0
board_build.filesystem = littlefs
monitor_filters = esp32_exception_decoder
monitor_speed = 115200
board_build.f_cpu = 240000000L
build_unflags =
	-std=gnu++11
build_flags =
	-std=gnu++17
	-D BUILD_ENV_NAME=$PIOENV
	-D BUILD_TIME=$UNIX_TIME
	-D USER_SETUP_LOADED
	-D DISABLE_ALL_LIBRARY_WARNINGS
	-D ILI9341_DRIVER
	-D SMOOTH_FONT
	-D LOAD_FONT2
	-D LOAD_GLCD
	-D ARDUINOJSON_ENABLE_COMMENTS=1
	; Advanced optimization flags
	-O3
	-DCORE_DEBUG_LEVEL=1
	-DCONFIG_ESP32_DEFAULT_CPU_FREQ_240=1
	-DCONFIG_FREERTOS_HZ=1000
	; Memory optimization
	-DCONFIG_SPIRAM_CACHE_WORKAROUND=1
	-DCONFIG_SPIRAM_USE_MALLOC=1
	; Network optimizations
	-DCONFIG_LWIP_MAX_SOCKETS=16
	-DCONFIG_ASYNC_TCP_MAX_ACK_TIME=3000
	-DCONFIG_ASYNC_TCP_PRIORITY=10
	; Security enhancements
	-DCONFIG_ESP32_WIFI_ENABLE_WPA3_SAE=1
	-DCONFIG_MBEDTLS_SSL_PROTO_TLS1_3=1
	; Performance monitoring
	-DCONFIG_ESP32_ENABLE_COREDUMP_TO_FLASH=1
	-DCONFIG_ESP_TASK_WDT_TIMEOUT_S=10
; ----------------------------------------------------------------------------------------
; !!! this configuration expects an ESP32-S3 32MB Flash 8MB RAM
; ----------------------------------------------------------------------------------------
[env:ESP32_S3_C6_NANO_AP]
board = esp32-s3-devkitc-1
board_build.partitions = 32MB_partition table.csv
build_unflags =
	-std=gnu++11
	-D CONFIG_MBEDTLS_INTERNAL_MEM_ALLOC=y
lib_deps =
	${env.lib_deps}
build_flags = 
	-std=gnu++17
	${env.build_flags}
	-D HAS_BLE_WRITER
	-D CORE_DEBUG_LEVEL=0
	-D ARDUINO_USB_CDC_ON_BOOT
	-D CONFIG_ESP32S3_SPIRAM_SUPPORT=1
	-D CONFIG_SPIRAM_USE_MALLOC=1
	-D POWER_NO_SOFT_POWER
	-D BOARD_HAS_PSRAM
	-D CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y
	-D FLASHER_AP_SS=-1
	-D FLASHER_AP_CLK=-1
	-D FLASHER_AP_MOSI=-1
	-D FLASHER_AP_MISO=-1
	-D FLASHER_AP_RESET=47
	-D FLASHER_AP_POWER={-1}
	-D FLASHER_AP_TEST=-1
	-D FLASHER_AP_TXD=14
	-D FLASHER_AP_RXD=13
	-D FLASHER_DEBUG_TXD=12
	-D FLASHER_DEBUG_RXD=11
	-D FLASHER_DEBUG_PROG=21
	-D FLASHER_LED=38
	-D MD5_ENABLED=1
	-D SERIAL_FLASHER_INTERFACE_UART=1
	-D SERIAL_FLASHER_BOOT_HOLD_TIME_MS=50
	-D SERIAL_FLASHER_RESET_HOLD_TIME_MS=100
	-D C6_OTA_FLASHING
	-D HAS_SUBGHZ
build_src_filter =
	+<*>-<usbflasher.cpp>-<swd.cpp>-<webflasher.cpp>
board_build.flash_mode=opi
board_build.arduino.memory_type = opi_opi
board_build.psram_type=qspi_opi
board_upload.maximum_size = 33554432
board_upload.maximum_ram_size = 327680
; ----------------------------------------------------------------------------------------
; !!! this configuration is work in progress, do not use for now
; ----------------------------------------------------------------------------------------
[env:OutdoorAP]
board = esp32-s3-devkitc-1
board_build.partitions = 32MB_partition table.csv
build_unflags =
	-std=gnu++11
	-D ARDUINO_USB_MODE=1
	-D CONFIG_MBEDTLS_INTERNAL_MEM_ALLOC=y
build_flags =
	-std=gnu++17
	${env.build_flags}
	-D OutdoorAP
	-D HAS_RGB_LED
	-D CORE_DEBUG_LEVEL=0
	-D ARDUINO_USB_MODE=0
	-D CONFIG_ESP32S3_SPIRAM_SUPPORT=1
	-D CONFIG_SPIRAM_USE_MALLOC=1
	-D POWER_NO_SOFT_POWER
	-D BOARD_HAS_PSRAM
	-D CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y
	-D FLASHER_AP_SS=-1
	-D FLASHER_AP_CLK=-1
	-D FLASHER_AP_MOSI=-1
	-D FLASHER_AP_MISO=-1
	-D FLASHER_AP_RESET=47
	-D FLASHER_AP_POWER={-1}
	-D FLASHER_AP_TEST=1
	-D SERIAL_FLASHER_INTERFACE_UART=1
	-D SERIAL_FLASHER_BOOT_HOLD_TIME_MS=50
	-D SERIAL_FLASHER_RESET_HOLD_TIME_MS=100
	-D SERIAL_FLASHER_FLASH_HOLD_TIME_MS=100
	-D HAS_SUBGHZ
	-D HAS_TFT
	-D HAS_BLE_WRITER
	-D MD5_ENABLED=1
	-D C6_OTA_FLASHING
	-D FIND_MY_TAG
	-D TAG_LED_CONTROL
	-D ADVANCED_TAG_SEARCH
	-D WEB_UI_ENHANCED
	-D TAG_BATTERY_MONITOR
	-D TAG_SIGNAL_MONITOR
	-D OUTDOOR_AP_FEATURES
	-D MANUAL_CONFIG_ONLY
	-D ST7789_DRIVER
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	-D TFT_MISO=-1
	-D TFT_MOSI=13
	-D TFT_SCLK=12
	-D TFT_CS=10
	-D TFT_DC=11
	-D TFT_RST=1
	-D TFT_RGB_ORDER=TFT_BGR
	-D USE_HSPI_PORT
	-D FLASHER_AP_TXD=17 
	-D FLASHER_AP_RXD=18
	-D FLASHER_DEBUG_TXD=12
	-D FLASHER_DEBUG_RXD=11
	-D FLASHER_DEBUG_PROG=21
	-D FLASHER_LED=21
	-D FLASHER_RGB_LED=38
build_src_filter =
	+<*>-<usbflasher.cpp>-<swd.cpp>-<webflasher.cpp>
board_build.flash_mode=opi
board_build.arduino.memory_type = opi_opi
board_build.psram_type=qspi_opi
board_upload.maximum_size = 16777216
board_upload.maximum_ram_size = 327680
; ----------------------------------------------------------------------------------------
