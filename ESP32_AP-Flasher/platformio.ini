[env]
; Choose below between platformio/espressif32 (Arduino 2.x) and pioarduino (Arduino 3.x)
; Updated to latest stable platform for better performance and security
platform = platformio/espressif32@^6.10.0
;platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
; Force older, more stable esptool version
platform_packages =
    tool-esptoolpy@^1.40501.0
; Updated library versions for better compatibility and security
lib_deps =
	; Core async web server libraries - using working forks
	https://github.com/me-no-dev/AsyncTCP.git
	https://github.com/me-no-dev/ESPAsyncWebServer.git

	; JSON handling - latest stable version
	bblanchon/ArduinoJson@^6.21.5

	; Display libraries - updated versions with ESP32-S3 fixes
	bodmer/TFT_eSPI@^2.5.43
	https://github.com/Bodmer/TJpg_Decoder.git

	; XML and QR code - maintained versions
	https://github.com/nlimper/shoddyxml2#d19a4e5
	https://github.com/nlimper/QRCodeGenerator

	; LED control - latest version with ESP32-S3/C6 support
	fastled/FastLED@^3.9.18

	; SPI library - maintained version
	https://github.com/MajenkoLibraries/SoftSPI

	; Enhanced libraries - updated for better compatibility
	; Advanced OTA library with improved error handling
	ayushsharma82/ElegantOTA@^2.2.9

	; Modern task scheduler for better multitasking
	arkhipenko/TaskScheduler@^3.8.5

	; Advanced networking utilities
	marian-craciunescu/ESP32Ping@^1.7.0

	; IR Remote control library
	; arduino-irremote/IRremote@^4.4.3

	; RFID RC522 library - DISABLED
	; miguelbalboa/MFRC522@^1.4.10
board_build.filesystem = littlefs
monitor_filters = esp32_exception_decoder
monitor_speed = 115200
board_build.f_cpu = 240000000L
; Build performance optimizations
check_skip_packages = yes
build_unflags =
	-std=gnu++11
build_flags =
	-std=gnu++17
	-D BUILD_ENV_NAME=$PIOENV
	-D BUILD_TIME=$UNIX_TIME
	-D USER_SETUP_LOADED
	-D DISABLE_ALL_LIBRARY_WARNINGS
	-D ILI9341_DRIVER
	-D SMOOTH_FONT
	-D LOAD_FONT2
	-D LOAD_GLCD
	-D ARDUINOJSON_ENABLE_COMMENTS=1
	; Performance optimization - faster compile and runtime
	-O2
	-DNDEBUG
	-ffast-math
	-fno-rtti
	-fno-exceptions
	; Memory optimization for PSRAM
	-DCONFIG_SPIRAM_USE_MALLOC=1
	; Network optimizations
	-DCONFIG_LWIP_MAX_SOCKETS=16
	; Security enhancements
	-DCONFIG_ESP32_WIFI_ENABLE_WPA3_SAE=1
	; WiFi scan and performance optimizations
	-DCONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=16
	-DCONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM=32
	-DCONFIG_ESP32_WIFI_TX_BUFFER_TYPE=1
	-DCONFIG_ESP32_WIFI_DYNAMIC_TX_BUFFER_NUM=32
	-DCONFIG_ESP32_WIFI_AMPDU_TX_ENABLED=1
	-DCONFIG_ESP32_WIFI_AMPDU_RX_ENABLED=1
	-DCONFIG_ESP32_WIFI_NVS_ENABLED=1
	; Compilation speed optimizations
	-DESP_LOG_LEVEL=ESP_LOG_WARN  ; Reduce log overhead
	-DCORE_DEBUG_LEVEL=0          ; Disable Arduino debug
	-DCONFIG_LOG_DEFAULT_LEVEL=2  ; Reduce ESP-IDF logging


[env:OutdoorAP]
board = esp32-s3-devkitc-1
board_build.partitions = 32MB_partition table.csv
build_unflags =
	-std=gnu++11
	-D ARDUINO_USB_MODE=1
	-D CONFIG_MBEDTLS_INTERNAL_MEM_ALLOC=y
build_flags =
	-std=gnu++17
	${env.build_flags}
	; ========== Core Device Configuration ==========
	-D OutdoorAP
	-D BOARD_HAS_PSRAM
	-D CONFIG_ESP32S3_SPIRAM_SUPPORT=1
	-D CONFIG_SPIRAM_USE_MALLOC=1
	-D CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y
	-D POWER_NO_SOFT_POWER
	-D MANUAL_CONFIG_ONLY
	-D CORE_DEBUG_LEVEL=0
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1

	; ========== Hardware Features ==========
	; Display Support (Full UI)
	-D HAS_TFT=1
	-D ST7789_DRIVER
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	-D TFT_MISO=-1
	-D TFT_MOSI=13
	-D TFT_SCLK=12
	-D TFT_CS=10
	-D TFT_DC=11
	-D TFT_RST=1
	-D TFT_RGB_ORDER=TFT_BGR
	-D USE_HSPI_PORT

	; LED Support (Full UI)
	-D HAS_RGB_LED=1
	-D FLASHER_RGB_LED=38
	-D FLASHER_LED=21

	; Radio & Communication (UI Status)
	-D HAS_SUBGHZ=1
	-D HAS_BLE_WRITER=1
	-D HAS_H2=1
	-D HAS_TSLR=1

	; External Interfaces (UI Supported)
	-D HAS_EXT_FLASHER=1
	; -D HAS_USB=1  ; Disabled - USB interface issues
	; -D HAS_IR_REMOTE=1
	; -D HAS_RC522=1  ; RFID module disabled

	; Extended Hardware (Backend Support)
	; -D HAS_SDCARD=1
	; -D SUPPORT_TOUCH_INTERFACE=1

	; ========== Advanced Features ==========
	; OTA & Flashing Support
	-D C6_OTA_FLASHING
	-D MD5_ENABLED=1
	-D SERIAL_FLASHER_INTERFACE_UART=1
	-D SERIAL_FLASHER_BOOT_HOLD_TIME_MS=50
	-D SERIAL_FLASHER_RESET_HOLD_TIME_MS=100
	-D SERIAL_FLASHER_FLASH_HOLD_TIME_MS=100

	; Tag Management & Control Features (UI Supported)
	-D FIND_MY_TAG=1
	-D TAG_LED_CONTROL=1
	-D ADVANCED_TAG_SEARCH=1
	-D TAG_BATTERY_MONITOR=1
	-D TAG_SIGNAL_MONITOR=1

	; Web UI & API Enhancements
	-D WEB_UI_ENHANCED=1
	-D OUTDOOR_AP_FEATURES=1
	-D API_ENDPOINTS_EXTENDED=1

	; Network Features (Backend Support)
	-D WIFI_ADVANCED_FEATURES=1
	-D NETWORK_DIAGNOSTICS=1

	; Performance & Optimization Features
	-D USE_SOFTSPI
	-D ENABLEKERNING
	-D MEMORY_OPTIMIZED=1

	; ========== Pin Configurations ==========
	; Main Flasher Pins
	-D FLASHER_AP_SS=-1
	-D FLASHER_AP_CLK=-1
	-D FLASHER_AP_MOSI=-1
	-D FLASHER_AP_MISO=-1
	-D FLASHER_AP_RESET=47
	-D FLASHER_AP_POWER={-1}
	-D FLASHER_AP_TEST=1
	-D FLASHER_AP_TXD=17
	-D FLASHER_AP_RXD=18

	; Debug Interface
	-D FLASHER_DEBUG_TXD=12
	-D FLASHER_DEBUG_RXD=11
	-D FLASHER_DEBUG_PROG=21

	; External Flasher Pins
	-D FLASHER_EXT_TEST=-1
	-D FLASHER_EXT_RXD=-1
	-D FLASHER_EXT_TXD=-1
	-D FLASHER_EXT_POWER={-1}
	-D FLASHER_EXT_SS=-1
	-D FLASHER_EXT_CLK=-1
	-D FLASHER_EXT_MOSI=-1
	-D FLASHER_EXT_MISO=-1
	-D FLASHER_EXT_RESET=-1

	; Alternative Flasher Pins
	-D FLASHER_ALT_POWER={-1}
	-D FLASHER_ALT_SS=-1
	-D FLASHER_ALT_CLK=-1
	-D FLASHER_ALT_MOSI=-1
	-D FLASHER_ALT_MISO=-1
	-D FLASHER_ALT_RESET=-1

	; IR Remote Pins
	; -D IR_SEND_PIN=14
	; -D IR_RECV_PIN=15
	; -D SEND_LEDC_CHANNEL=0  ; Fix for IRremote library ESP32 compatibility

	; RC522 RFID Pins (SPI interface) - DISABLED
	; -D RC522_SCK_PIN=5
	; -D RC522_MISO_PIN=19
	; -D RC522_MOSI_PIN=23
	; -D RC522_SS_PIN=22
	; -D RC522_RST_PIN=4

	; SD Card Pins (disabled for this configuration)
	; -D SD_CARD_SS=-1
	; -D SD_CARD_CLK=-1
	; -D SD_CARD_MISO=-1
	; -D SD_CARD_MOSI=-1

build_src_filter =
	+<*>
board_build.flash_mode=opi
board_build.arduino.memory_type = opi_opi
board_build.psram_type=qspi_opi
board_upload.maximum_size = 16777216
board_upload.maximum_ram_size = 327680

; ============================================================================
; Wokwi Simulation Environment
; Optimized configuration for Wokwi ESP32-S3 simulation
; ============================================================================
[env:WokwiAP]
board = esp32-s3-devkitc-1
board_build.partitions = 32MB_partition table.csv
lib_deps =
	mathieucarbou/ESPAsyncWebServer@^3.3.25
	ArduinoJson @ ^7.2.1
	crankyoldgit/IRremoteESP8266@^2.8.6
	bodmer/TFT_eSPI@^2.5.43
build_unflags =
	-std=gnu++11
	-D ARDUINO_USB_MODE=1
	-D CONFIG_MBEDTLS_INTERNAL_MEM_ALLOC=y
build_flags =
	-std=gnu++17
	${env.build_flags}
	; ========== Core Device Configuration ==========
	-D OutdoorAP
	-D BOARD_HAS_PSRAM
	-D CONFIG_ESP32S3_SPIRAM_SUPPORT=1
	-D CONFIG_SPIRAM_USE_MALLOC=1
	-D CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y
	-D POWER_NO_SOFT_POWER
	-D MANUAL_CONFIG_ONLY
	-D CORE_DEBUG_LEVEL=3
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1

	; ========== Wokwi Simulation Optimizations ==========
	-D WOKWI_SIMULATION=1
	-D DISABLE_WATCHDOG=1
	-D CONFIG_ESP_TASK_WDT_EN=0
	-D CONFIG_ESP_INT_WDT_EN=0
	-D CONFIG_ESP_BROWNOUT_DET=0

	; ========== Chip definitions for compatibility ==========
	-D SHORT_CHIP_NAME=\"S3\"
	-D ESP_CHIP_TYPE=9

	; ========== Hardware Features (Minimal for simulation) ==========
	; Use dummy headers for excluded hardware
	-D USE_DUMMY_LEDS=1
	-D USE_DUMMY_CONTENT_MANAGER=1

	; Basic LED Support
	-D HAS_RGB_LED=1
	-D RGB_LED_PIN=38
	-D RGB_LED_COUNT=1

	; Disable complex hardware for simulation
	-D HAS_TFT=0
	-D HAS_OLED=0
	-D HAS_BUTTONS=0
	-D HAS_LED_DRIVER=0
	-D HAS_ROTARY=0
	-D HAS_TEMP_SENSOR=0
	-D HAS_CURRENT_SENSOR=0
	-D HAS_VOLTAGE_SENSOR=0
	-D HAS_BLE=0
	-D HAS_SUBGHZ=0
	-D HAS_C6_MODULE=1
	-D HAS_RC522=0
	-D HAS_IR_REMOTE=1
	-D HAS_SD_CARD=0
	-D HAS_TFT=0
	-D HAS_IPS_DISPLAY=0
	-D HAS_LEDS=0
	-D HAS_POWER_MANAGEMENT=0
	-D HAS_FLASHER=0
	-D HAS_SERIAL_FLASHER=0

	; ========== Pin Configurations ==========
	; Main Flasher Pins (disabled for simulation)
	-D FLASHER_AP_SS=-1
	-D FLASHER_AP_CLK=-1
	-D FLASHER_AP_MOSI=-1
	-D FLASHER_AP_MISO=-1
	-D FLASHER_AP_RESET=-1
	-D FLASHER_AP_POWER={-1}
	-D FLASHER_AP_TEST=-1
	-D FLASHER_AP_TXD=-1
	-D FLASHER_AP_RXD=-1

	; Debug Interface (disabled for simulation)
	-D FLASHER_DEBUG_TXD=-1
	-D FLASHER_DEBUG_RXD=-1
	-D FLASHER_DEBUG_PROG=-1

	; External Flasher Pins (disabled for simulation)
	-D FLASHER_EXT_TEST=-1
	-D FLASHER_EXT_RXD=-1
	-D FLASHER_EXT_TXD=-1
	-D FLASHER_EXT_POWER={-1}
	-D FLASHER_EXT_SS=-1
	-D FLASHER_EXT_CLK=-1
	-D FLASHER_EXT_MOSI=-1
	-D FLASHER_EXT_MISO=-1
	-D FLASHER_EXT_RESET=-1

	; Alternative Flasher Pins (disabled for simulation)
	-D FLASHER_ALT_POWER={-1}
	-D FLASHER_ALT_SS=-1
	-D FLASHER_ALT_CLK=-1
	-D FLASHER_ALT_MOSI=-1
	-D FLASHER_ALT_MISO=-1
	-D FLASHER_ALT_RESET=-1

	; IR Remote Pins (enabled for simulation)
	-D IR_SEND_PIN=5
	-D IR_RECV_PIN=4
	-D SEND_LEDC_CHANNEL=0

	; ESP32-C6 Module Pins (enabled for simulation)
	-D C6_RX_PIN=47
	-D C6_TX_PIN=48
	-D C6_RESET_PIN=21
	-D C6_BOOT_PIN=33

	; LED Pins for Wokwi
	-D FLASHER_RGB_LED=38
	-D FLASHER_LED=21

	; ========== Memory and Performance ==========
	-D CONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=8
	-D CONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM=16
	-D CONFIG_ESP32_WIFI_TX_BUFFER_TYPE=0
	-D CONFIG_ESP32_WIFI_DYNAMIC_TX_BUFFER_NUM=16
	-D CONFIG_LWIP_TCP_MSS=1436
	-D CONFIG_LWIP_TCP_WND_DEFAULT=5744
	-D CONFIG_LWIP_TCP_RECVMBOX_SIZE=6

build_src_filter =
	+<*>
	-<ble_*.cpp>
	-<rc522_*.cpp>
	-<ips_display.cpp>
	-<powermgt.cpp>
	-<espflasher.cpp>
	-<flasher.cpp>
	-<serialap.cpp>
	-<leds.cpp>
	-<swd.cpp>
	-<usbflasher.cpp>
	-<webflasher.cpp>
	-<makeimage.cpp>

; Override flash settings for DIO mode to match firmware
board_build.flash_mode = dio
board_build.flash_freq = 80m
board_build.flash_size = 32MB
board_build.arduino.memory_type = opi_opi
board_build.psram_type = opi_opi
board_upload.maximum_size = 16777216
board_upload.maximum_ram_size = 327680
