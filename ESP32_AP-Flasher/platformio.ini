[env]
; Choose below between fastled/FastLED@3.6.0n platformio/espressif32 (Arduino 2.x) and pioarduino (Arduino 3.x)
; Updated to latest stable platform for better performance and security
platform = platformio/espressif32@^6.10.0
;platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
; Force older, more stable esptool version
platform_packages =
    tool-esptoolpy@^1.40501.0
; Updated library versions for better compatibility and security
lib_deps =
	; Core async web server libraries - using working forks
	https://github.com/me-no-dev/AsyncTCP.git
	https://github.com/me-no-dev/ESPAsyncWebServer.git

	; JSON handling - stable version with better compatibility
	bblanchon/ArduinoJson@^6.21.5

	; Display libraries - updated versions with ESP32-S3 fixes
	; bodmer/TFT_eSPI@^2.5.43  ; TFT removed
	https://github.com/Bodmer/TJpg_Decoder.git

	; XML and QR code - maintained versions
	https://github.com/nlimper/shoddyxml2#d19a4e5
	https://github.com/nlimper/QRCodeGenerator

	; LED control - latest version with ESP32-S3/C6 support
	fastled/FastLED@^3.9.18  ;

	; SPI library - maintained version
	https://github.com/MajenkoLibraries/SoftSPI

	; Enhanced libraries - updated for better compatibility
	; Advanced OTA library with improved error handling
	ayushsharma82/ElegantOTA@^2.2.9

	; Modern task scheduler for better multitasking
	arkhipenko/TaskScheduler@^3.8.5

	; Advanced networking utilities
	marian-craciunescu/ESP32Ping@^1.7.0

	; IR Remote control library - ENABLED
	arduino-irremote/IRremote@^4.4.3

	; RFID RC522 library - ENABLED
	miguelbalboa/MFRC522@^1.4.10
board_build.filesystem = littlefs
monitor_filters = esp32_exception_decoder
monitor_speed = 115200
board_build.f_cpu = 240000000L

; ESP-IDF compatibility and stack optimization flags
; Build performance optimizations
check_skip_packages = yes
build_unflags =
	-std=gnu++11
build_flags =
	-std=gnu++17
	; -Wno-deprecated-declarations
	-D DISABLE_AUTO_FLASH=1
	-D BUILD_ENV_NAME=$PIOENV
	-D BUILD_TIME=$UNIX_TIME
	-D USER_SETUP_LOADED
	-D DISABLE_ALL_LIBRARY_WARNINGS
	; -D ILI9341_DRIVER  ; TFT removed
	-D SMOOTH_FONT
	-D LOAD_FONT2
	-D LOAD_GLCD
	-D ARDUINOJSON_ENABLE_COMMENTS=1
	; Performance optimization - faster compile and runtime
	-O2
	-DNDEBUG
	-ffast-math
	-fno-exceptions
	; Stack size optimizations for stability - ESP-IDF 5.x format
	; -DCONFIG_ESP_MAIN_TASK_STACK_SIZE=32768
	; -DCONFIG_ARDUINO_LOOP_STACK_SIZE=32768
	; -DCONFIG_FREERTOS_IDLE_TASK_STACKSIZE=4096
	; -DCONFIG_ESP_INT_WDT_TIMEOUT_MS=5000
	; -DCONFIG_ESP_TASK_WDT_TIMEOUT_S=60
	; Suppress ESP-IDF deprecation warnings
	; -Wno-deprecated-declarations
	; Removed -fno-rtti to avoid warnings on C files
	; Memory optimization for PSRAM
	-DCONFIG_SPIRAM_USE_MALLOC=1
	; Network optimizations - remove conflicting defines
	-DCONFIG_LWIP_MAX_SOCKETS=16
	; Security enhancements
	-DCONFIG_ESP32_WIFI_ENABLE_WPA3_SAE=1
	; ESP-IDF include paths for library compatibility
	; Commented out problematic ESP-IDF include paths that conflict with Arduino framework
	; WiFi optimizations - use sdkconfig values to avoid redefinition warnings
	; -DCONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=16
	; -DCONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM=32
	; -DCONFIG_ESP32_WIFI_TX_BUFFER_TYPE=1
	; -DCONFIG_ESP32_WIFI_DYNAMIC_TX_BUFFER_NUM=32
	; -DCONFIG_ESP32_WIFI_AMPDU_TX_ENABLED=1
	; -DCONFIG_ESP32_WIFI_AMPDU_RX_ENABLED=1
	; -DCONFIG_ESP32_WIFI_NVS_ENABLED=1
	; Compilation speed optimizations
	; -DCONFIG_LOG_DEFAULT_LEVEL=2  ; Use sdkconfig value to avoid redefinition
	; -DCORE_DEBUG_LEVEL=0          ; Disable Arduino debug - defined per environment
	; Use CONFIG_LOG_DEFAULT_LEVEL instead of ESP_LOG_LEVEL to avoid redefinition


[env:OutdoorAP]
board = esp32-s3-devkitc-1
board_build.partitions = 32MB_partition table.csv

; ========== Build Configuration ==========
build_unflags =
	-std=gnu++11
	-D ARDUINO_USB_MODE=1
	-D CONFIG_MBEDTLS_INTERNAL_MEM_ALLOC=y

build_flags =
	-std=gnu++17
	${env.build_flags}

	; ========== Core Device Configuration ==========
	-D OutdoorAP
	-D BOARD_HAS_PSRAM
	-D CONFIG_ESP32S3_SPIRAM_SUPPORT=1
	-D CONFIG_SPIRAM_USE_MALLOC=1
	-D CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y
	-D POWER_NO_SOFT_POWER
	-D MANUAL_CONFIG_ONLY
	-D CORE_DEBUG_LEVEL=0
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1

	; ========== Hardware Features ==========
	; -D HAS_TFT=1  ; TFT display removed
	; -D ST7789_DRIVER  ; TFT driver removed
	; -D TFT_WIDTH=240  ; TFT config removed
	; -D TFT_HEIGHT=320  ; TFT config removed
	; -D TFT_MISO=-1  ; TFT config removed
	; -D TFT_MOSI=13  ; TFT config removed
	; -D TFT_SCLK=12  ; TFT config removed
	; -D TFT_CS=10  ; TFT config removed
	; -D TFT_DC=11  ; TFT config removed
	; -D TFT_RST=1  ; TFT config removed
	; -D TFT_RGB_ORDER=TFT_BGR  ; TFT config removed
	; -D USE_HSPI_PORT  ; TFT config removed

	; ========== Communication & Flashing ==========
	-D MD5_ENABLED=0
	-D SERIAL_FLASHER_INTERFACE_UART=1
	-D SERIAL_FLASHER_BOOT_HOLD_TIME_MS=50
	-D SERIAL_FLASHER_RESET_HOLD_TIME_MS=100
	-D SERIAL_FLASHER_FLASH_HOLD_TIME_MS=100

	; ========== Feature Flags ==========
	-D FIND_MY_TAG=0
	-D TAG_LED_CONTROL=1
	-D ADVANCED_TAG_SEARCH=1
	-D TAG_BATTERY_MONITOR=1
	-D TAG_SIGNAL_MONITOR=1
	-D WEB_UI_ENHANCED=1
	-D OUTDOOR_AP_FEATURES=1
	-D API_ENDPOINTS_EXTENDED=1
	-D WIFI_ADVANCED_FEATURES=1
	-D NETWORK_DIAGNOSTICS=1

	; ========== Performance Optimizations ==========
	-D USE_SOFTSPI
	-D ENABLEKERNING
	-D MEMORY_OPTIMIZED=1

	; ========== Pin Configurations ==========
	; Main Flasher Interface
	-D FLASHER_AP_SS=-1
	-D FLASHER_AP_CLK=-1
	-D FLASHER_AP_MOSI=-1
	-D FLASHER_AP_MISO=-1
	-D FLASHER_AP_RESET=47
	-D FLASHER_AP_POWER={-1}
	-D FLASHER_AP_TEST=1
	-D FLASHER_AP_TXD=17
	-D FLASHER_AP_RXD=18

	; Debug Interface
	-D FLASHER_DEBUG_TXD=12
	-D FLASHER_DEBUG_RXD=11
	-D FLASHER_DEBUG_PROG=21

	; External Flasher Interface (Disabled)
	-D FLASHER_EXT_TEST=-1
	-D FLASHER_EXT_RXD=-1
	-D FLASHER_EXT_TXD=-1
	-D FLASHER_EXT_POWER={-1}
	-D FLASHER_EXT_SS=-1
	-D FLASHER_EXT_CLK=-1
	-D FLASHER_EXT_MOSI=-1
	-D FLASHER_EXT_MISO=-1
	-D FLASHER_EXT_RESET=-1

	; Alternative Flasher Interface (Disabled)
	-D FLASHER_ALT_POWER={-1}
	-D FLASHER_ALT_SS=-1
	-D FLASHER_ALT_CLK=-1
	-D FLASHER_ALT_MOSI=-1
	-D FLASHER_ALT_MISO=-1
	-D FLASHER_ALT_RESET=-1

	; ========== Device Identification ==========
	-D SHORT_CHIP_NAME=\"S3\"
	-D ESP_CHIP_TYPE=9

; ========== Build Optimization ==========
build_src_filter =
	+<*>
	-<*_optimized.cpp>
	-<wokwi_stubs.cpp>
	-<g5/>

; ========== Hardware Configuration ==========
board_build.flash_mode = opi
board_build.flash_freq = 80m
board_build.flash_size = 32MB
board_build.arduino.memory_type = opi_opi
board_build.psram_type = opi_opi
board_upload.maximum_size = 16777216
board_upload.maximum_ram_size = 327680

[env:ESP32_C6]
board = esp32-c6-devkitc-1
board_build.partitions = ESP32_C6_partition_table.csv

; ========== Build Configuration ==========
build_unflags =
	-std=gnu++11

build_flags =
	-std=gnu++17
	${env.build_flags}

	; ========== Core Device Configuration ==========
	-D ESP32_C6
	-D BOARD_HAS_WIFI6
	-D CONFIG_ESP32C6_WIFI6_SUPPORT=1
	-D POWER_NO_SOFT_POWER
	-D MANUAL_CONFIG_ONLY
	-D CORE_DEBUG_LEVEL=1
	-D ARDUINO_USB_CDC_ON_BOOT=1

	; ========== Hardware Features ==========
	-D HAS_C6_DISPLAY_COMM=1
	-D HAS_IR_REMOTE=1
	-D HAS_RC522=1
	-D ADVANCED_PIN_MONITORING=1

	; ========== Communication & Interfaces ==========
	-D SERIAL_FLASHER_INTERFACE_UART=1
	-D SERIAL_FLASHER_BOOT_HOLD_TIME_MS=50
	-D SERIAL_FLASHER_RESET_HOLD_TIME_MS=100
	-D SERIAL_FLASHER_FLASH_HOLD_TIME_MS=100

	; ========== C6 Specific Features ==========
	-D C6_DISPLAY_COMM_ENABLED=1
	-D C6_LOW_POWER_MODE=1
	-D C6_THREAD_SUPPORT=1
	-D C6_ZIGBEE_SUPPORT=1

	; ========== IR Remote Configuration ==========
	-D IR_SEND_PIN=4
	-D IR_RECEIVE_PIN=5
	-D IR_LED_PIN=6
	-D ENABLE_IR_PROTOCOLS=1

	; ========== RFID RC522 Configuration ==========
	-D RC522_SS_PIN=10
	-D RC522_RST_PIN=9
	-D RC522_SCK_PIN=18
	-D RC522_MOSI_PIN=19
	-D RC522_MISO_PIN=20
	-D RC522_IRQ_PIN=8

	; ========== Pin Monitoring Configuration ==========
	-D PIN_MONITOR_ENABLED=1
	-D ANALOG_MONITOR_PINS='{0,1,2,3}'
	-D DIGITAL_MONITOR_PINS='{7,8,9,10,11,12,13,14,15}'

	; ========== Communication Pins ==========
	-D FLASHER_C6_TXD=16
	-D FLASHER_C6_RXD=17
	-D FLASHER_C6_RESET=21
	-D FLASHER_C6_POWER=22

	; ========== Device Identification ==========
	-D SHORT_CHIP_NAME=\"C6\"
	-D ESP_CHIP_TYPE=13

; ========== Build Optimization ==========
build_src_filter =
	+<*>
	-<*_optimized.cpp>
	-<wokwi_stubs.cpp>
	-<g5/>

; ========== Hardware Configuration ==========
board_build.flash_mode = qio
board_build.flash_freq = 80m
board_build.flash_size = 8MB
board_upload.maximum_size = 8388608
board_upload.maximum_ram_size = 327680
