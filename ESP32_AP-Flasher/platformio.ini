[env]
; Choose below between platformio/espressif32 (Arduino 2.x) and pioarduino (Arduino 3.x)
; Updated to latest stable platform for better performance and security
platform = platformio/espressif32@^6.10.0
;platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
; Force older, more stable esptool version
platform_packages = 
    tool-esptoolpy@^1.40501.0
; Updated library versions for better compatibility and security
lib_deps =
	; Core async web server libraries - using working forks
	https://github.com/me-no-dev/AsyncTCP.git
	https://github.com/me-no-dev/ESPAsyncWebServer.git
	
	; JSON handling - latest stable version
	bblanchon/ArduinoJson@^6.21.5
	
	; Display libraries - updated versions with ESP32-S3 fixes
	bodmer/TFT_eSPI@^2.5.43
	https://github.com/Bodmer/TJpg_Decoder.git
	
	; XML and QR code - maintained versions
	https://github.com/nlimper/shoddyxml2#d19a4e5
	https://github.com/nlimper/QRCodeGenerator
	
	; LED control - latest version with ESP32-S3/C6 support
	fastled/FastLED@^3.9.18
	
	; SPI library - maintained version
	https://github.com/MajenkoLibraries/SoftSPI
	
	; Enhanced libraries - updated for better compatibility
	; Advanced OTA library with improved error handling
	ayushsharma82/ElegantOTA@^2.2.9
	
	; Modern task scheduler for better multitasking
	arkhipenko/TaskScheduler@^3.8.5
	
	; Advanced networking utilities
	marian-craciunescu/ESP32Ping@^1.7.0
board_build.filesystem = littlefs
monitor_filters = esp32_exception_decoder
monitor_speed = 115200
board_build.f_cpu = 240000000L
build_unflags =
	-std=gnu++11
build_flags =
	-std=gnu++17
	-D BUILD_ENV_NAME=$PIOENV
	-D BUILD_TIME=$UNIX_TIME
	-D USER_SETUP_LOADED
	-D DISABLE_ALL_LIBRARY_WARNINGS
	-D ILI9341_DRIVER
	-D SMOOTH_FONT
	-D LOAD_FONT2
	-D LOAD_GLCD
	-D ARDUINOJSON_ENABLE_COMMENTS=1
	; Performance optimization
	-O2
	; Memory optimization for PSRAM
	-DCONFIG_SPIRAM_USE_MALLOC=1
	; Network optimizations
	-DCONFIG_LWIP_MAX_SOCKETS=16
	; Security enhancements
	-DCONFIG_ESP32_WIFI_ENABLE_WPA3_SAE=1


[env:OutdoorAP]
board = esp32-s3-devkitc-1
board_build.partitions = 32MB_partition table.csv
build_unflags =
	-std=gnu++11
	-D ARDUINO_USB_MODE=1
	-D CONFIG_MBEDTLS_INTERNAL_MEM_ALLOC=y
build_flags =
	-std=gnu++17
	${env.build_flags}
	-D OutdoorAP
	-D HAS_RGB_LED
	-D CORE_DEBUG_LEVEL=0
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1
	-D CONFIG_ESP32S3_SPIRAM_SUPPORT=1
	-D CONFIG_SPIRAM_USE_MALLOC=1
	-D POWER_NO_SOFT_POWER
	-D BOARD_HAS_PSRAM
	-D CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y
	-D FLASHER_AP_SS=-1
	-D FLASHER_AP_CLK=-1
	-D FLASHER_AP_MOSI=-1
	-D FLASHER_AP_MISO=-1
	-D FLASHER_AP_RESET=47
	-D FLASHER_AP_POWER={-1}
	-D FLASHER_AP_TEST=1
	-D SERIAL_FLASHER_INTERFACE_UART=1
	-D SERIAL_FLASHER_BOOT_HOLD_TIME_MS=50
	-D SERIAL_FLASHER_RESET_HOLD_TIME_MS=100
	-D SERIAL_FLASHER_FLASH_HOLD_TIME_MS=100
	-D HAS_SUBGHZ
	-D HAS_TFT
	-D HAS_BLE_WRITER
	-D MD5_ENABLED=1
	-D C6_OTA_FLASHING
	-D FIND_MY_TAG
	-D TAG_LED_CONTROL
	-D ADVANCED_TAG_SEARCH
	-D WEB_UI_ENHANCED
	-D TAG_BATTERY_MONITOR
	-D TAG_SIGNAL_MONITOR
	-D OUTDOOR_AP_FEATURES
	-D MANUAL_CONFIG_ONLY
	-D ST7789_DRIVER
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	-D TFT_MISO=-1
	-D TFT_MOSI=13
	-D TFT_SCLK=12
	-D TFT_CS=10
	-D TFT_DC=11
	-D TFT_RST=1
	-D TFT_RGB_ORDER=TFT_BGR
	-D USE_HSPI_PORT
	-D FLASHER_AP_TXD=17 
	-D FLASHER_AP_RXD=18
	-D FLASHER_DEBUG_TXD=12
	-D FLASHER_DEBUG_RXD=11
	-D FLASHER_DEBUG_PROG=21
	-D FLASHER_LED=21
	-D FLASHER_RGB_LED=38
	-D FLASHER_EXT_TEST=-1
	-D FLASHER_EXT_RXD=-1
	-D FLASHER_EXT_TXD=-1
	-D FLASHER_EXT_POWER={-1}
	-D FLASHER_ALT_POWER={-1}
	-D FLASHER_EXT_SS=-1
	-D FLASHER_EXT_CLK=-1
	-D FLASHER_EXT_MOSI=-1
	-D FLASHER_EXT_MISO=-1
	-D FLASHER_EXT_RESET=-1
	-D FLASHER_ALT_SS=-1
	-D FLASHER_ALT_CLK=-1
	-D FLASHER_ALT_MOSI=-1
	-D FLASHER_ALT_MISO=-1
	-D FLASHER_ALT_RESET=-1
	-D ST7789_DRIVER
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	-D TFT_MISO=-1
	-D TFT_MOSI=13
	-D TFT_SCLK=12
	-D TFT_CS=10
	-D TFT_DC=11
	-D TFT_RST=1
	-D TFT_RGB_ORDER=TFT_BGR
	-D USE_HSPI_PORT
	-D HAS_EXT_FLASHER
	-D HAS_TSLR

build_src_filter =
	+<*>
board_build.flash_mode=opi
board_build.arduino.memory_type = opi_opi
board_build.psram_type=qspi_opi
board_upload.maximum_size = 16777216
board_upload.maximum_ram_size = 327680

