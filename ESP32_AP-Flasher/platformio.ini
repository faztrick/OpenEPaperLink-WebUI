; ----------------------------------------------------------------------------------------
; ESP32-C6 AP and Tag Flasher - Using ESP-IDF framework
; ----------------------------------------------------------------------------------------
[env:ESP32_C6]
platform = platformio/espressif32@^6.10.0
board = esp32-c6-devkitc-1
framework = espidf
board_build.partitions = ESP32_C6_partition_table.csv
build_flags = 
	-D BUILD_ENV_NAME=$PIOENV
	-D BUILD_TIME=$UNIX_TIME
	-D C6_OTA_FLASHING
	-D MD5_ENABLED=1
	-D HAS_SUBGHZ
	-D HAS_EXT_FLASHER
	; AP communication pins
	-D FLASHER_AP_TXD=7
	-D FLASHER_AP_RXD=6
	-D FLASHER_AP_RESET=15
	; Debug/programming pins
	-D FLASHER_DEBUG_TXD=4
	-D FLASHER_DEBUG_RXD=5
	-D FLASHER_DEBUG_PROG=8
	; LED
	-D FLASHER_LED=9
	; Unused pins set to -1
	-D FLASHER_AP_SS=-1
	-D FLASHER_AP_CLK=-1
	-D FLASHER_AP_MOSI=-1
	-D FLASHER_AP_MISO=-1
	-D FLASHER_AP_POWER={-1}
	-D FLASHER_AP_TEST=-1
	
board_build.flash_mode=dio
board_upload.maximum_size = 8388608
board_upload.maximum_ram_size = 327680