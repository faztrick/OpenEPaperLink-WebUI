# Wokwi Configuration File
# Reference: https://docs.wokwi.com/vscode/project-config
[wokwi]
version = 1
firmware = 'OutdoorAP/firmware.bin'
elf = 'OutdoorAP/firmware.elf'
gdbServerPort = 3333

type = "esp32s3"

# Match the build configuration
[esp32s3]
psram = "opi_opi"
flashSize = "32MB"
psramSize = "8MB"
flashMode = "qio"
flashFreq = "80m"

# USB configuration to match ARDUINO_USB_CDC_ON_BOOT=1
[usb]
cdc = true
mode = 1
